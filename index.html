<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שיעורי הרה"ג רבי יצחק ולדומירסקי שליט"א</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://danvlado1234-sketch.github.io/">
<!--
  מאז 15.10.2026 כל השיעורים (משנה, פרשה, מועדים) באתר אחד בכתובת הראשית.
  הדף הזה רק מעביר לשם, כולל הפרמטרים (?m=ברכות&p=2, ?parasha=נח - גם מהמייל),
  ו-index.html בכתובת הראשית מתרגם אותם לדף המתאים.
  התיקייה עדיין חיה: list.json / uploads.json כאן הם מקור הנתונים של האתר (live.js),
  ו-upload.ps1 ממשיך לעבוד בדיוק כמו קודם.
-->
<script>
  (function () {
    var to = '/' + location.search + location.hash;
    var go = function () { location.replace(to); };
    // ל-/shiurim-parasha/ היה service worker משלו — מסירים, כדי שלא יגיש מכאן את הדף הישן בלי רשת
    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
      var here = location.origin + location.pathname.replace(/[^/]*$/, '');
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.filter(function (r) { return r.scope === here; }).map(function (r) { return r.unregister(); }));
      }).then(go, go);
      setTimeout(go, 1500);
    } else go();
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121110; color: #eee6d8;
    font: 18px/1.6 system-ui, sans-serif; text-align: center; }
  a { color: #e3c27a; }
</style>
</head>
<body>
<p>שיעורי הרב עברו לכתובת אחת.<br><a href="/">לאתר השיעורים</a></p>
</body>
</html>
