<script>
(function(){
  // ====== הגדרות ======
  // כתובת הענן הציבורית של דלי הפרשות. עד שהדלי נוצר - האתר יציג הודעת הקמה.
  const R2_BASE = "https://pub-c502103793ec448b9964b8779d053cd4.r2.dev";
  const RABBI = 'הרה"ג רבי יצחק ולדומירסקי שליט"א';

  // ====== האמת הקבועה: פרשות, סדר, ושיוך לחומש ======
  const CHUMASHIM = [
    { name:'בראשית', parashot:['בראשית','נח','לך לך','וירא','חיי שרה','תולדות','ויצא','וישלח','וישב','מקץ','ויגש','ויחי'] },
    { name:'שמות',   parashot:['שמות','וארא','בא','בשלח','יתרו','משפטים','תרומה','תצוה','כי תשא','ויקהל','פקודי'] },
    { name:'ויקרא',  parashot:['ויקרא','צו','שמיני','תזריע','מצורע','אחרי מות','קדושים','אמור','בהר','בחוקותי'] },
    { name:'במדבר',  parashot:['במדבר','נשא','בהעלותך','שלח','קרח','חוקת','בלק','פינחס','מטות','מסעי'] },
    { name:'דברים',  parashot:['דברים','ואתחנן','עקב','ראה','שופטים','כי תצא','כי תבוא','נצבים','וילך','האזינו','וזאת הברכה'] },
    // "מועדים" אינו חומש אמיתי - קבוצה מלאכותית לחגים ומועדי ישראל, באותו
    // מנגנון בדיוק (תיקייה משלה, קובץ מתחיל ב"מועד_" במקום "פרשת_"). הסדר
    // הוא סדר לוח השנה העברי, מתחילת תשרי.
    { name:'מועדים', parashot:['ראש השנה','יום כיפור','סוכות','שמחת תורה','חנוכה','עשרה בטבת','טו בשבט','תענית אסתר','פורים','פסח','לג בעומר','שבועות','שבעה עשר בתמוז','תשעה באב'] }
  ];
  // ששת הזוגות הקבועים - תמיד כפתור/דף אחד משותף
  const PAIRS = [
    ['ויקהל','פקודי'], ['תזריע','מצורע'], ['אחרי מות','קדושים'],
    ['בהר','בחוקותי'], ['מטות','מסעי'], ['נצבים','וילך']
  ];

  // מפות עזר שנגזרות מהטבלאות
  const pairKeyOf = {};   // 'מטות' -> 'מטות מסעי', 'מסעי' -> 'מטות מסעי'
  const pairLabel = {};   // 'מטות מסעי' -> 'מטות · מסעי'
  PAIRS.forEach(p => {
    const key = p[0] + ' ' + p[1];
    pairKeyOf[p[0]] = key; pairKeyOf[p[1]] = key;
    pairLabel[key] = p[0] + ' · ' + p[1];
  });
  const validNames = {};  // כל שם חוקי (יחיד או זוג) -> true
  CHUMASHIM.forEach(c => c.parashot.forEach(n => validNames[n] = true));
  Object.keys(pairLabel).forEach(k => validNames[k] = true);

  // מועד או פרשה? קובע את המילה שמוצגת לפני השם בכל מקום באתר
  const moadimNames = {};
  (CHUMASHIM.find(c => c.name === 'מועדים') || { parashot:[] }).parashot.forEach(n => moadimNames[n] = true);
  function itemNounOf(key){ return moadimNames[key] ? 'מועד זה' : 'פרשה זו'; }
  // תווית תצוגה: לפרשה מוצג "פרשת X", למועד מוצג רק "X" בלי המילה "מועד" -
  // מיותר ואפילו מוזר בתוך דף שכבר נקרא "מועדים" (למשל "מועד חנוכה" בתוך
  // עמוד מועדים). ה"מועד"/"פרשת" עדיין קיימים בשם הקובץ ובלוגיקת הפענוח -
  // זה רק עניין תצוגתי.
  function itemLabel(key, label){ return moadimNames[key] ? label : ('פרשת ' + label); }
  function keyLabel(key){ return itemLabel(key, pairLabel[key] || key); }
  function nShiurim(n){ return n === 1 ? 'שיעור אחד' : n + ' שיעורים'; }
  function chumashLabel(name){ return name === 'מועדים' ? name : 'חומש ' + name; }

  // ====== גימטריה לשנים (תשפו -> 786, לצורך מיון) ======
  const GEM = {'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,'כ':20,'ל':30,'מ':40,'נ':50,'ס':60,'ע':70,'פ':80,'צ':90,'ק':100,'ר':200,'ש':300,'ת':400,'ך':20,'ם':40,'ן':50,'ף':80,'ץ':90};
  function yearValue(y){ let s=0; for (const ch of y){ if (!GEM[ch]) return 0; s += GEM[ch]; } return s; }
  function yearDisplay(y){ return y.length > 1 ? y.slice(0,-1) + '"' + y.slice(-1) : y; }

  // ====== פענוח שם קובץ ======
  // פרשת_<שם>_<שנה>[_שיעור_<אות>][_חלק_<אות>][_שבת_<מילה>][_עיון].mp3/m4a
  //   "שיעור ב" = שיעור נפרד ועצמאי שני על אותה פרשה באותה שנה
  //   "חלק ב"   = המשך של אותו שיעור עצמו (הקלטה שנחתכה לשניים)
  //   "שבת <מילה>" = שבת מיוחדת (הגדול/שובה/זכור/פרה/החודש/חזון/נחמו וכו') -
  //               לשיעור ששייך תוכנית-אירועים למועד אחר (למשל שיעור על
  //               שבת הגדול משוייך לתיקיית ולשם הקובץ של פסח, לא מועד נפרד).
  //               תמיד לפני "עיון" אם שניהם קיימים.
  //   "עיון"    = דגל בלבד (בלי ערך אחריו), תמיד בסוף השם. סימון תוכן
  //               הלכתי/עיוני להבדיל מוורט (ברירת המחדל, בלי הדגל).
  // כולם אופציונליים ויכולים להופיע יחד.
  function parseFilename(path){
    const filename = path.split('/').pop();
    const base = filename.replace(/\.(mp3|m4a)$/i, '');
    let tokens = base.split('_').filter(Boolean);
    if (tokens[0] === 'פרשת' || tokens[0] === 'מועד') tokens = tokens.slice(1);
    let isIyun = false;
    if (tokens[tokens.length - 1] === 'עיון'){ isIyun = true; tokens = tokens.slice(0, -1); }
    let shabbatName = null;
    if (tokens.length >= 2 && tokens[tokens.length - 2] === 'שבת'){
      shabbatName = 'שבת ' + tokens[tokens.length - 1];
      tokens = tokens.slice(0, -2);
    }
    let part = null, lesson = null;
    const iLesson = tokens.indexOf('שיעור');
    const iPart = tokens.indexOf('חלק');
    // כל תגית נקראת עד לתגית הבאה (או עד הסוף), כדי שהסדר ביניהן לא ישנה
    if (iLesson > -1){
      const end = (iPart > iLesson) ? iPart : tokens.length;
      lesson = tokens.slice(iLesson + 1, end).join(' ');
    }
    if (iPart > -1){
      const end = (iLesson > iPart) ? iLesson : tokens.length;
      part = tokens.slice(iPart + 1, end).join(' ');
    }
    // חותכים את שם הפרשה+שנה עד התגית המוקדמת מבין השתיים
    const marks = [iLesson, iPart].filter(i => i > -1);
    if (marks.length) tokens = tokens.slice(0, Math.min.apply(null, marks));
    if (tokens.length < 2) return null;
    const year = tokens[tokens.length-1];
    const name = tokens.slice(0,-1).join(' ');
    if (!validNames[name] || !yearValue(year)) return null;
    // דף הבית של השיעור: הפרשה עצמה, או דף הזוג אם היא חלק מזוג
    const pageKey = pairLabel[name] ? name : (pairKeyOf[name] || name);
    return { path, filename, name, year, part, lesson, pageKey, isIyun, shabbatName };
  }

  // ====== מצב ======
  let index = {};      // pageKey -> [shiur,...]
  let unmatched = [];
  let pdfPaths = new Set();   // נתיבי סיכומי PDF שקיימים (אותו נתיב כמו השמע, סיומת שונה)
  let pdfVersions = {};       // נתיב PDF -> גרסה (pdf-versions.json), נוסף לקישור נגד מטמון
  let uploadDates = {};       // נתיב שמע -> תאריך העלאה (uploads.json) - רק מה שיוצג ב"חדש השבוע"
  let byPath = {};            // נתיב שמע -> השיעור המפוענח
  let view = { type:'shelf' };
  let setupMode = false;
  let parashaFilter = { key:null, val:'all' };   // סינון לפי שנה/עיון בדף פרשה
  const app = document.getElementById('app');

  function chumashOf(pageKey){
    for (const c of CHUMASHIM){
      for (const p of c.parashot){
        if (pageKey === p || (pairKeyOf[p] === pageKey)) return c.name;
      }
    }
    return null;
  }

  function totalCount(){
    let n = 0; for (const k in index) n += index[k].length; return n;
  }

  // רשימת "כפתורי" הפרשות של חומש: זוגות מאוחדים לכפתור אחד
  function pageKeysOf(chumash){
    const keys = []; const seen = {};
    for (const p of chumash.parashot){
      const key = pairKeyOf[p] || p;
      if (!seen[key]){ seen[key] = true; keys.push(key); }
    }
    return keys;
  }

  // ====== אייקונים ======
  // extra: מאפייני ציור ל-svg; בלי ערך = קווי מתאר. '' = בלי מאפיינים (צורה מלאה לפי ה-path)
  function svg(size, body, extra){ return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" ${extra == null ? 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' : extra}>${body}</svg>`; }
  const iconPlay  = n => svg(n, '<path d="M8 5v14l11-7z" fill="currentColor"/>', '');
  const iconPause = n => svg(n, '<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/>', '');
  const iconBack15 = n => svg(n, '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.5" font-size="7.5" font-family="Heebo,sans-serif" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">15</text>', 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"');
  const iconFwd15  = n => svg(n, '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.5" font-size="7.5" font-family="Heebo,sans-serif" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">15</text>', 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"');
  const ICON_BM    = svg(20, '<path d="M6 3h12v18l-6-4-6 4z"/>');
  const ICON_BM_ON = svg(20, '<path d="M6 3h12v18l-6-4-6 4z" fill="currentColor"/>');
  const ICON_MORE  = svg(20, '<circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/>', 'fill="currentColor"');
  const ICON_LINK  = svg(17, '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>');
  const ICON_CHECK = svg(17, '<circle cx="12" cy="12" r="9.5"/><path d="m7.5 12.5 3 3 6-6.5"/>');
  // הורדת השמע: אוזניות עם חץ למטה (להבדיל מ"סיכום", שהוא ה-PDF)
  const ICON_AUDIO_DL = svg(17, '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3z"/><path d="M3 19a2 2 0 0 0 2 2h1v-6H3z"/><path d="M12 9v7"/><path d="m9 13 3 3 3-3"/>');
  const ICON_DOC   = svg(14, '<path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/>');
  const ICON_BACK  = svg(20, '<path d="m9 6 6 6-6 6"/>', 'fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"');
  const ICON_CHEV  = svg(16, '<path d="m15 6-6 6 6 6"/>', 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"');
  const ICON_SEARCH = svg(17, '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>');
  const ICON_SHARE = svg(21, '<path d="M4 12v7h16v-7"/><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/>');
  const ICON_X     = svg(18, '<path d="M6 6l12 12M18 6 6 18"/>');

  // בונה קישור ישיר לפרשה+שנה מסוימת
  function directLink(key, year){
    const base = location.origin + location.pathname;
    return `${base}?parasha=${encodeURIComponent(key)}&year=${encodeURIComponent(year)}`;
  }

  function escAttr(s){ return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }

  function fallbackCopy(url){
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('הקישור הועתק'); }
    catch (e){ showToast('לא הצלחנו להעתיק — נסו שוב'); }
    document.body.removeChild(ta);
  }

  function copyLink(url){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(() => showToast('הקישור הועתק'), () => fallbackCopy(url));
    } else {
      fallbackCopy(url);
    }
  }

  function go(v){ view = v; render(); scrollTop(); }

  // כל הלחיצות בתוך הדפים מטופלות בהאצלת אירוע יחידה על app, כי app.innerHTML
  // מוחלף בכל רינדור - כך לא צריך לחבר מחדש מאזין לכל כפתור בנפרד.
  app.addEventListener('click', (e) => {
    const t = e.target;
    const play = t.closest('.play-btn');
    if (play){ playShiur(play.closest('[data-path]').dataset.path); return; }
    const save = t.closest('.save-btn');
    if (save){ toggleSaved(save.closest('[data-path]').dataset.path); return; }
    const more = t.closest('.more-btn');
    if (more){ openMenu(more); return; }
    if (t.closest('.back-btn')){ go(backTarget()); return; }
    const vol = t.closest('.vol');
    if (vol){ go({ type:'chumash', name:vol.dataset.chumash }); return; }
    const prow = t.closest('.prow');
    if (prow){ go({ type:'parasha', key:prow.dataset.key, year:prow.dataset.year || null }); return; }
    if (t.closest('#themeBtn')){ toggleTheme(); return; }
    const pill = t.closest('.pill');
    if (pill){ homeFilter = pill.dataset.hf; renderShelf(); return; }
    if (t.closest('#playParasha')){
      if (current && current.s.pageKey === view.key) togglePlay(); else playParasha(view.key);
      return;
    }
    if (t.closest('#shareParasha')){ copyLink(location.origin + location.pathname + '?parasha=' + encodeURIComponent(view.key)); return; }
    const chip = t.closest('.chip');
    if (chip){ parashaFilter = { key:view.key, val:chip.dataset.f }; renderParasha(view.key); return; }
    // כרטיס "חדש" / "המשך האזנה" - לחיצה על הכרטיס עצמו (לא על ▶) פותחת את הדף שלו
    const card = t.closest('.tile, .cont');
    if (card){
      const s = byPath[card.dataset.path];
      if (card.classList.contains('cont')){ playShiur(s.path); return; }
      if (s){ go({ type:'parasha', key:s.pageKey, year:s.year }); }
      return;
    }
    // לחיצה על שורת שיעור (לא על כפתור/קישור בתוכה) - מנגנת, כמו שיר באלבום
    const row = t.closest('.shiur-row');
    if (row && !t.closest('a,button')){ playShiur(row.dataset.path); return; }
    const link = t.closest('[data-go]');
    if (link){ go({ type:link.dataset.go }); return; }
    if (t.closest('#playListBtn')){ playList(); return; }
    if (t.closest('#installGo')){ doInstall(); return; }
    if (t.closest('#installX')){ dismissInstall(); return; }
  });

  // ====== תפריט "אפשרויות נוספות" (⋮) של כרטיס ======
  // תפריט אחד לכל האתר, נבנה מחדש בכל פתיחה לפי השיעור. נפתח מתחת לכפתור
  // (או מעליו, אם אין מקום למטה), ונסגר בלחיצה בחוץ, ב-Esc או בגלילה.
  const menuEl = document.getElementById('shiurMenu');
  let menuFor = null;   // { path, btn }

  // כמה מתחתית המסך תפוס ע"י הלשוניות והנגן הקטן (כדי שהתפריט לא ייפתח מתחתם)
  function bottomChrome(){
    const tabsTop = document.getElementById('tabs').getBoundingClientRect().top;
    const mini = document.body.classList.contains('has-player') ? 70 : 0;
    return tabsTop > window.innerHeight / 2 ? window.innerHeight - tabsTop + mini : mini;
  }

  function openMenu(btn){
    const path = btn.closest('[data-path]').dataset.path;
    if (menuFor && menuFor.path === path){ closeMenu(); return; }
    closeMenu();
    const s = byPath[path];
    if (!s) return;
    const done = !!(getProg(path) || {}).done;
    menuEl.innerHTML = `
      <a role="menuitem" href="${shiurUrl(s)}" download="${escAttr(s.filename)}" target="_blank" rel="noopener">${ICON_AUDIO_DL}<span>הורד את השיעור</span></a>
      <button role="menuitem" data-act="copy">${ICON_LINK}<span>העתק קישור לשיעור</span></button>
      <button role="menuitem" data-act="heard">${ICON_CHECK}<span>${done ? 'בטל סימון "נשמע"' : 'סמן כנשמע'}</span></button>`;
    menuFor = { path, btn };
    menuEl.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    const r = btn.getBoundingClientRect(), m = menuEl.getBoundingClientRect();
    const below = r.bottom + 6 + m.height < window.innerHeight - bottomChrome();
    menuEl.style.top = (window.scrollY + (below ? r.bottom + 6 : r.top - 6 - m.height)) + 'px';
    menuEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - m.width - 8)) + 'px';
    const first = menuEl.querySelector('a,button');
    if (first) first.focus({ preventScroll:true });
  }
  function closeMenu(){
    if (!menuFor) return;
    menuEl.hidden = true;
    menuFor.btn.setAttribute('aria-expanded', 'false');
    menuFor = null;
  }
  menuEl.addEventListener('click', (e) => {
    const item = e.target.closest('a,button');
    if (!item || !menuFor) return;
    const s = byPath[menuFor.path];
    if (item.dataset.act === 'copy') copyLink(directLink(s.pageKey, s.year));
    if (item.dataset.act === 'heard') toggleHeard(menuFor.path);
    closeMenu();
  });
  document.addEventListener('click', (e) => {
    if (menuFor && !menuEl.contains(e.target) && !e.target.closest('.more-btn')) closeMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (menuFor) closeMenu(); else if (sheetOpen) history.back();
  });
  window.addEventListener('scroll', closeMenu, { passive:true });
  window.addEventListener('resize', closeMenu);

  // ====== זיכרון האזנה (התקדמות, נשמע, הרשימה שלי) ======
  // נשמר בדפדפן של המכשיר בלבד (localStorage), בלי משתמשים. כל הגישה עוברת
  // דרך getProg/setProg - כדי שבעתיד אפשר יהיה לחבר כאן סנכרון להרשמה
  // אופציונלית בלי לגעת בשאר הקוד. המפתחות מתחילים ב-"parasha:" כי אתר
  // המשניות יושב באותה כתובת (danvlado1234-sketch.github.io) ולכן חולק
  // את אותו אחסון - כך הם לא מתערבבים.
  // מבנה: נתיב שמע -> { t: שניות שנשמעו, d: אורך, done: נשמע, saved: ברשימה, at: מתי }
  const STORE_KEY = 'parasha:progress';
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { progress = {}; }
  let saveTimer = null;
  function saveProgress(){
    clearTimeout(saveTimer); saveTimer = null;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {}
  }
  function saveSoon(){ if (!saveTimer) saveTimer = setTimeout(saveProgress, 4000); }
  function getProg(path){ return progress[path] || null; }
  function setProg(path, patch){
    const prev = progress[path] || {};
    const next = Object.assign({}, prev, patch, { at: Date.now() });
    // שיעור שנשמע יוצא מהרשימה לבד ועובר ל"נשמעו לאחרונה"
    if (next.done && !prev.done){ next.doneAt = Date.now(); next.saved = false; }
    progress[path] = next;
    saveSoon();
  }

  function listOf(pred, sortKey, desc){
    return Object.keys(progress)
      .filter(path => byPath[path] && pred(progress[path]))
      .sort((a, b) => ((progress[a][sortKey] || 0) - (progress[b][sortKey] || 0)) * (desc ? -1 : 1))
      .map(path => byPath[path]);
  }
  // שמורים להמשך - בסדר שבו נשמרו (זה סדר הניגון)
  function savedList(){ return listOf(p => p.saved && !p.done, 'savedAt', false); }
  // התחילו ולא סיימו (ולא שמורים - אלה מופיעים ברשימה עצמה)
  function continueList(){ return listOf(p => !p.saved && !p.done && p.t > 5, 'at', true).slice(0, 10); }
  function heardList(){ return listOf(p => p.done, 'doneAt', true).slice(0, 10); }
  // השיעור האחרון שהתחילו ולא סיימו (כולל שמורים) - לכרטיס "המשך האזנה" בבית
  function lastInProgress(){ return listOf(p => !p.done && p.t > 5, 'at', true)[0] || null; }

  function toggleSaved(path){
    const p = getProg(path) || {};
    // שמירה של שיעור שכבר נשמע = רוצים לשמוע שוב, אז מתחילים מההתחלה
    setProg(path, p.saved ? { saved: false } : Object.assign({ saved: true, savedAt: Date.now() }, p.done ? { done: false, t: 0 } : {}));
    saveProgress();
    refreshCards(path);
    updateBadges();
    updateSheet();
    showToast(p.saved ? 'הוסר מהרשימה שלי' : 'נוסף לרשימה שלי');
  }
  function toggleHeard(path){
    const p = getProg(path) || {};
    setProg(path, p.done ? { done: false, t: 0 } : { done: true });
    saveProgress();
    refreshCards(path);
    updateBadges();
  }
  const DONE_RATIO = 0.9;   // מ-90% השיעור נחשב "נשמע"

  function fmtTime(sec){
    sec = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), ss = String(sec % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
  }
  function mins(sec){ return Math.max(1, Math.round(sec / 60)); }

  // שורת המידע והפס של כרטיס, לפי מצב ההאזנה
  function cardState(path){
    const p = getProg(path) || {};
    const isCur = current && current.path === path;
    const playing = isCur && !audio.paused;
    const d = p.d || 0, t = p.t || 0;
    let meta = '';
    if (playing) meta = 'מתנגן עכשיו' + (d ? ` · ${mins(t)} מתוך ${mins(d)} דק'` : '');
    else if (p.done) meta = `<span class="done">✓ נשמע</span>${d ? ` · ${mins(d)} דק'` : ''}`;
    else if (t > 5 && d) meta = `נותרו ${mins(d - t)} דק' · נשמעו ${mins(t)} מתוך ${mins(d)}`;
    else if (d) meta = `${mins(d)} דק'`;
    const pct = p.done ? 100 : (d ? Math.min(100, t / d * 100) : 0);
    return { meta, pct, done: !!p.done, saved: !!p.saved && !p.done, isCur, playing };
  }

  // מעדכן במקום (בלי רינדור מחדש) כל אלמנט עם data-path: כרטיס, "חדש", "המשך"
  function refreshCards(path){
    app.querySelectorAll('[data-path]').forEach(el => {
      if (path && el.dataset.path !== path) return;
      const st = cardState(el.dataset.path);
      const meta = el.querySelector('.shiur-meta'); if (meta) meta.innerHTML = st.meta;
      const bar = el.querySelector('.shiur-bar i'); if (bar) bar.style.width = st.pct + '%';
      el.classList.toggle('is-done', st.done);
      el.classList.toggle('playing', st.isCur);
      el.classList.toggle('started', st.pct > 0);
      const ts = el.querySelector('.tile-s'); if (ts) ts.textContent = st.done ? '✓ נשמע' : 'חדש' + (st.meta && !st.playing ? ' · ' + st.meta.replace(/<[^>]+>/g, '') : '');
      const sb = el.querySelector('.save-btn');
      if (sb){
        sb.classList.toggle('on', st.saved);
        sb.innerHTML = st.saved ? ICON_BM_ON : ICON_BM;
        sb.title = st.saved ? 'הסר מהרשימה שלי' : 'שמור לרשימה שלי';
      }
      const pb = el.querySelector('.play-btn');
      if (pb){
        const n = el.classList.contains('tile') ? 16 : el.classList.contains('shiur-row') ? 18 : 20;
        pb.innerHTML = st.playing ? iconPause(n) : iconPlay(n);
        pb.setAttribute('aria-label', st.playing ? 'השהה' : 'נגן');
      }
    });
  }

  // ====== הנגן ======
  // נגן אחד לכל האתר, מחוץ לאזור שמתחלף בניווט - לכן השיעור ממשיך להתנגן
  // כשעוברים בין דפים. נגן קטן מעל הלשוניות, ולחיצה עליו פותחת נגן מלא.
  // מהירות אחת לכל השיעורים, נשמרת בין ביקורים.
  const audio = document.getElementById('audio');
  const miniEl = document.getElementById('mini');
  const sheetEl = document.getElementById('sheet');
  const seekEl = document.getElementById('seek');
  let current = null;   // { path, s, title, fromList }
  let seeking = false;
  let sheetOpen = false;

  const SPEEDS = [1, 1.25, 1.5, 1.75, 2];
  const SPEED_KEY = 'parasha:speed';
  let speed = 1;
  try {
    const saved = parseFloat(localStorage.getItem(SPEED_KEY) || localStorage.getItem('playbackSpeed'));
    if (SPEEDS.includes(saved)) speed = saved;
  } catch (e) {}
  function applySpeed(){ audio.defaultPlaybackRate = speed; audio.playbackRate = speed; }
  function updateSpeedBtn(){ document.getElementById('speedVal').textContent = speed + '×'; }
  document.getElementById('speedBtn').addEventListener('click', () => {
    speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
    try { localStorage.setItem(SPEED_KEY, String(speed)); } catch (e) {}
    applySpeed(); updateSpeedBtn();
  });
  updateSpeedBtn();
  document.getElementById('miniPlay').innerHTML = iconPlay(28);
  document.getElementById('bigPlay').innerHTML = iconPlay(34);
  document.getElementById('miniBack').innerHTML = iconBack15(26);
  document.getElementById('back15').innerHTML = iconBack15(36);
  document.getElementById('fwd15').innerHTML = iconFwd15(36);

  // קישור לסיכום ה-PDF של שיעור (אותו נתיב, סיומת pdf), או null אם אין
  function summaryUrl(s){
    const pdfPath = s.path.replace(/\.(m4a|mp3)$/i, '.pdf');
    if (!pdfPaths.has(pdfPath)) return null;
    const pdfVer = pdfVersions[pdfPath];
    return R2_BASE.replace(/\/$/,'') + '/' + pdfPath.split('/').map(encodeURIComponent).join('/') + (pdfVer ? '?v=' + encodeURIComponent(pdfVer) : '');
  }
  function shiurUrl(s){ return R2_BASE.replace(/\/$/,'') + '/' + s.path.split('/').map(encodeURIComponent).join('/'); }

  // תת-כותרת של שיעור בלי שם הפרשה: "תשפ"ו · שיעור א · עיון"
  function shiurDetail(s){
    return `${yearDisplay(s.year)}${s.lesson ? ' · שיעור ' + s.lesson : ''}${s.part ? ' · חלק ' + s.part : ''}${s.shabbatName ? ' · ' + s.shabbatName : ''}${s.isIyun ? ' · עיון' : ''}`;
  }

  function playShiur(path){
    if (current && current.path === path){ audio.paused ? audio.play() : audio.pause(); return; }
    const s = byPath[path];
    if (!s) return;
    if (current) rememberPosition();
    const p = getProg(path) || {};
    // ממשיכים מאיפה שעצרו - אלא אם נשמע כבר, או שנשארו רק שניות בודדות
    const start = (!p.done && p.t > 5 && !(p.d && p.d - p.t < 10)) ? Math.floor(p.t) : 0;
    // שיעור מהרשימה - בסיומו ממשיכים לבא ברשימה, כמו רשימת השמעה
    current = { path, s, title: shiurTitle(s, s.pageKey, true), fromList: !!p.saved && !p.done };
    audio.src = shiurUrl(s) + (start ? '#t=' + start : '');
    applySpeed();
    document.getElementById('miniTitle').textContent = current.title;
    // הנגן הקטן והמלא בצבעי החומש של השיעור, עם העטיפה שלו
    const ch = chumashOf(s.pageKey);
    miniEl.setAttribute('style', colorVars(ch));
    sheetEl.setAttribute('style', colorVars(ch));
    document.getElementById('miniCover').outerHTML = coverHtml(ch, '', '', 'plain', 0, 'miniCover');
    document.getElementById('sheetArt').outerHTML = coverHtml(ch, coverText(s.pageKey), chumashLabel(ch) + ' · ' + yearDisplay(s.year), 'sheet-art', 52, 'sheetArt');
    miniEl.hidden = false;
    document.body.classList.add('has-player');
    updateTimes(start, p.d || 0);
    updateSheet();
    setMediaSession();
    audio.play().catch(() => {});
    refreshCards();
  }

  function rememberPosition(){
    if (!current || !audio.duration || !isFinite(audio.duration)) return;
    const t = audio.currentTime, d = audio.duration;
    const patch = { t, d };
    if (t / d >= DONE_RATIO) patch.done = true;
    setProg(current.path, patch);
  }

  function updateTimes(t, d){
    document.getElementById('miniTime').textContent = d ? `${fmtTime(t)} / ${fmtTime(d)}` : fmtTime(t);
    document.getElementById('curT').textContent = fmtTime(t);
    document.getElementById('remT').textContent = '-' + fmtTime(Math.max(0, d - t));
    const pct = d ? Math.min(100, t / d * 100) : 0;
    document.getElementById('miniProg').style.width = pct + '%';
    if (!seeking) seekEl.value = Math.round(pct * 10);
  }

  // תוכן הנגן המלא לפי השיעור הנוכחי
  function updateSheet(){
    if (!current) return;
    const s = current.s, p = getProg(current.path) || {};
    document.getElementById('sheetSrc').textContent = current.fromList ? 'מתנגן מתוך: הרשימה שלי' : 'מתנגן עכשיו';
    document.getElementById('sheetTitle').textContent = itemLabel(s.name, pairLabel[s.name] || s.name);
    document.getElementById('sheetSub').textContent = shiurDetail(s) + ' · ' + RABBI;
    const sum = document.getElementById('sheetSummary'), url = summaryUrl(s);
    sum.hidden = !url; if (url) sum.href = url;
    const saved = !!p.saved && !p.done;
    const sv = document.getElementById('sheetSave');
    sv.innerHTML = (saved ? ICON_BM_ON : ICON_BM) + (saved ? 'שמור' : 'שמירה');
    sv.classList.toggle('on', saved);
    sv.setAttribute('aria-label', saved ? 'הסר מהרשימה שלי' : 'שמור לרשימה שלי');
    document.getElementById('sheetNext').hidden = !(current.fromList && savedList().some(x => x.path !== current.path));
  }

  let lastUi = 0;
  audio.addEventListener('timeupdate', () => {
    if (!current) return;
    const d = audio.duration, t = audio.currentTime;
    if (d && isFinite(d)) updateTimes(t, d);
    const now = Date.now();
    if (now - lastUi < 1000) return;   // פעם בשנייה מספיק לכרטיסים ולזיכרון
    lastUi = now;
    const wasDone = !!(getProg(current.path) || {}).done;
    rememberPosition();
    refreshCards(current.path);
    if (!wasDone && (getProg(current.path) || {}).done){ updateBadges(); updateSheet(); }
  });
  audio.addEventListener('loadedmetadata', () => {
    if (!current) return;
    updateTimes(audio.currentTime, audio.duration);
    rememberPosition();
    refreshCards(current.path);
  });
  function onPlayState(){
    const bp = document.getElementById('playParasha');
    if (bp) bp.innerHTML = current && current.s.pageKey === view.key && !audio.paused ? iconPause(26) : iconPlay(26);
    document.getElementById('miniPlay').innerHTML = audio.paused ? iconPlay(28) : iconPause(28);
    document.getElementById('bigPlay').innerHTML = audio.paused ? iconPlay(34) : iconPause(34);
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing';
    if (current){ rememberPosition(); saveProgress(); refreshCards(); }
  }
  audio.addEventListener('play', onPlayState);
  audio.addEventListener('pause', onPlayState);
  audio.addEventListener('ended', () => {
    if (current){ setProg(current.path, { done: true, t: audio.duration || 0 }); saveProgress(); updateBadges(); }
    onPlayState();
    if (current && current.fromList) playNextInList();
  });
  // "נגן את הרשימה": מהשיעור הראשון ברשימה. אם הוא כבר מתנגן - לא עוצרים אותו,
  // רק מסמנים שמעכשיו ממשיכים ממנו ברשימה
  function playList(){
    const first = savedList()[0];
    if (!first) return;
    if (current && current.path === first.path){
      current.fromList = true; updateSheet(); setMediaSession();
      if (audio.paused) audio.play();
    } else playShiur(first.path);
  }
  function playNextInList(){
    const next = savedList().find(s => !current || s.path !== current.path);
    if (!next){ showToast('סיימת את הרשימה'); return; }
    showToast('ממשיך לשיעור הבא ברשימה');
    playShiur(next.path);
  }
  audio.addEventListener('error', () => { if (current && audio.getAttribute('src')) showToast('לא הצלחנו לטעון את השיעור — נסו שוב'); });

  seekEl.addEventListener('input', () => {
    seeking = true;
    if (audio.duration) document.getElementById('curT').textContent = fmtTime(seekEl.value / 1000 * audio.duration);
  });
  seekEl.addEventListener('change', () => {
    seeking = false;
    if (audio.duration && isFinite(audio.duration)) audio.currentTime = seekEl.value / 1000 * audio.duration;
  });
  function skip(sec){
    if (!audio.duration) return;
    audio.currentTime = Math.min(Math.max(0, audio.currentTime + sec), audio.duration - 0.5);
  }
  function togglePlay(){ if (current) audio.paused ? audio.play() : audio.pause(); }
  document.getElementById('miniBack').addEventListener('click', () => skip(-15));
  document.getElementById('back15').addEventListener('click', () => skip(-15));
  document.getElementById('fwd15').addEventListener('click', () => skip(15));
  document.getElementById('miniPlay').addEventListener('click', togglePlay);
  document.getElementById('bigPlay').addEventListener('click', togglePlay);
  document.getElementById('sheetSave').addEventListener('click', () => { if (current) toggleSaved(current.path); });
  document.getElementById('sheetNext').addEventListener('click', () => { if (current){ rememberPosition(); playNextInList(); } });

  // נגן מלא: נפתח כ"דף" בהיסטוריה, כך שכפתור "חזור" של הטלפון סוגר אותו
  function openSheet(){
    if (!current || sheetOpen) return;
    sheetOpen = true;
    updateSheet();
    sheetEl.hidden = false;
    document.body.style.overflow = 'hidden';
    history.pushState({ sheet:true }, '', location.href);
    document.getElementById('bigPlay').focus({ preventScroll:true });
  }
  function hideSheet(){
    sheetOpen = false;
    sheetEl.hidden = true;
    document.body.style.overflow = '';
  }
  document.getElementById('miniOpen').addEventListener('click', openSheet);
  document.getElementById('sheetDown').addEventListener('click', () => history.back());
  document.getElementById('sheetClose').addEventListener('click', () => {
    rememberPosition(); saveProgress();
    audio.pause(); current = null;
    audio.removeAttribute('src'); audio.load();
    miniEl.hidden = true;
    document.body.classList.remove('has-player');
    refreshCards();
    history.back();
  });
  document.getElementById('sheetTitle').addEventListener('click', () => {
    if (!current) return;
    const s = current.s;
    history.back();
    // אחרי שה"חזור" של הנגן מתבצע - מעבר לדף השיעור
    setTimeout(() => go({ type:'parasha', key:s.pageKey, year:s.year }), 60);
  });

  // מסך הנעילה / אוזניות / שעון: שם השיעור וכפתורי שליטה
  function setMediaSession(){
    if (!('mediaSession' in navigator) || !current) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: current.title,
        artist: RABBI,
        album: 'שיעורי פרשת שבוע ומועדים',
        artwork: [
          { src: new URL('icons/icon-512.png', location.href).href, sizes: '512x512', type: 'image/png' },
          { src: new URL('bg-rabbi.jpg', location.href).href, sizes: '2000x1500', type: 'image/jpeg' }
        ]
      });
      const ms = navigator.mediaSession;
      ms.setActionHandler('play', () => audio.play());
      ms.setActionHandler('pause', () => audio.pause());
      ms.setActionHandler('seekbackward', () => skip(-15));
      ms.setActionHandler('seekforward', () => skip(15));
      ms.setActionHandler('seekto', (e) => { if (e.seekTime != null) audio.currentTime = e.seekTime; });
      ms.setActionHandler('nexttrack', current.fromList ? () => playNextInList() : null);
    } catch (e) {}
  }

  // יציאה מהדף / מעבר לאפליקציה אחרת - שומרים מיד, לא מחכים לטיימר
  window.addEventListener('pagehide', () => { rememberPosition(); saveProgress(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden){ rememberPosition(); saveProgress(); } });

  // ====== לשוניות ======
  const TAB_OF = { shelf:'home', chumash:'home', parasha:'home', error:'home', recent:'recent', search:'search', list:'list' };
  document.getElementById('tabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    const t = tab.dataset.tab;
    go({ type: t === 'home' ? 'shelf' : t });
  });
  function updateTabs(){
    const active = TAB_OF[view.type] || 'home';
    document.querySelectorAll('.tab').forEach(b => {
      const on = b.dataset.tab === active;
      b.classList.toggle('on', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }
  // מונים: "חדש" = שיעורי השבוע שלא נשמעו; "הרשימה שלי" = השמורים
  function newUnheard(){
    const r = recentGroups();
    if (!r.thisWeek) return 0;
    return r.dates.reduce((n, d) => n + r.groups[d].filter(s => !(getProg(s.path) || {}).done).length, 0);
  }
  function updateBadges(){
    const setBadge = (id, n) => { const b = document.getElementById(id); b.hidden = !n; b.textContent = n || ''; };
    setBadge('badgeNew', newUnheard());
    setBadge('badgeList', savedList().length);
  }

  // ====== כתובת הדף משקפת את התצוגה ======
  // כל מעבר בין דפים נרשם בהיסטוריית הדפדפן, כדי שכפתור "חזור" של הטלפון
  // יחזור דף אחד אחורה (פרשה -> חומש -> דף הבית) ולא יצא מהאתר לגמרי.
  // אותו פורמט כמו directLink, כך שגם כתובת שהועתקה משורת הכתובת עובדת.
  function viewFromUrl(){
    const params = new URLSearchParams(location.search);
    if (params.has('new')) return { type:'recent' };
    if (params.has('list')) return { type:'list' };
    if (params.has('search')) return { type:'search' };
    const key = params.get('parasha');
    if (key && chumashOf(key)) return { type:'parasha', key, year: params.get('year') || null };
    const name = params.get('chumash');
    if (name && CHUMASHIM.some(c => c.name === name)) return { type:'chumash', name };
    return { type:'shelf' };
  }

  function urlOf(v){
    const params = new URLSearchParams();
    if (v.type === 'recent') params.set('new', '1');
    if (v.type === 'list') params.set('list', '1');
    if (v.type === 'search') params.set('search', '1');
    if (v.type === 'chumash') params.set('chumash', v.name);
    if (v.type === 'parasha'){
      params.set('parasha', v.key);
      if (v.year) params.set('year', v.year);
    }
    const q = params.toString();
    return location.pathname + (q ? '?' + q : '');
  }

  function sameView(a, b){
    return a.type === b.type && (a.name || null) === (b.name || null)
      && (a.key || null) === (b.key || null) && (a.year || null) === (b.year || null);
  }

  window.addEventListener('popstate', () => {
    if (sheetOpen){ hideSheet(); return; }
    if (view.type === 'error') return;
    view = viewFromUrl();
    render();
    window.scrollTo(0, 0);
  });

  // לאן מוביל חץ החזרה בראש דף פנימי
  function backTarget(){
    if (view.type === 'parasha') return { type:'chumash', name: chumashOf(view.key) };
    return { type:'shelf' };
  }

  function render(){
    closeMenu();
    if (view.type !== 'error' && !sameView(view, viewFromUrl())){
      history.pushState(null, '', urlOf(view));
    }
    if (view.type === 'error') renderError();
    else if (view.type === 'chumash') renderChumash(view.name);
    else if (view.type === 'parasha') renderParasha(view.key);
    else if (view.type === 'recent') renderRecent();
    else if (view.type === 'list') renderList();
    else if (view.type === 'search') renderSearch();
    else renderShelf();
    updateTabs();
    app.classList.remove('fade-in');
    void app.offsetWidth;
    app.classList.add('fade-in');
  }

  // ====== עטיפות ======
  // לכל חומש צבע משלו, כמו עטיפת אלבום - כך מזהים שיעור במבט, גם בנגן
  const CH_COLORS = {
    'בראשית':['#2d4f7c','#1a2f4d'], 'שמות':['#7c2d3a','#4a1822'], 'ויקרא':['#5a3d72','#342245'],
    'במדבר':['#5f6b2e','#394119'], 'דברים':['#2c6a4a','#173826'], 'מועדים':['#a57a2c','#654616']
  };
  function colorVars(chumash){ const c = CH_COLORS[chumash] || CH_COLORS['דברים']; return `--ca:${c[0]};--cb:${c[1]}`; }
  // עטיפה: text - הכיתוב הגדול, sub - שורה קטנה, base - גודל הגופן; שמות ארוכים מוקטנים לבד
  function coverHtml(chumash, text, sub, cls, base, id){
    const len = Math.max(...String(text || '').split('<br>').map(x => x.length), 1);
    const fs = Math.round((base || 22) * Math.max(0.5, Math.min(1, 6.5 / len)));
    return `<span class="cover${cls ? ' ' + cls : ''}"${id ? ` id="${id}"` : ''} style="${colorVars(chumash)};--fs:${fs}px">${text ? `<b>${text}</b>` : ''}${sub ? `<i>${sub}</i>` : ''}</span>`;
  }
  function coverText(key){ return (pairLabel[key] || key).replace(' · ', '<br>'); }
  function shiurCover(s, cls, base, withSub){
    const ch = chumashOf(s.pageKey);
    return coverHtml(ch, coverText(s.pageKey), withSub ? yearDisplay(s.year) : '', cls, base);
  }

  function topbar(crumb){
    return `<div class="topbar"><button class="back-btn" aria-label="חזרה">${ICON_BACK}</button><span class="crumb">${crumb || ''}</span></div>`;
  }

  // ====== מצב יום / לילה ======
  const THEME_KEY = 'parasha:theme';
  const ICON_SUN  = svg(20, '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>');
  const ICON_MOON = svg(20, '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>');
  const curTheme = () => document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  // הכפתור מראה לאן עוברים: בלילה - שמש (לעבור ליום), ביום - ירח
  function themeBtnHtml(){
    const light = curTheme() === 'light';
    return `<button class="theme-btn" id="themeBtn" title="${light ? 'מעבר למצב לילה' : 'מעבר למצב יום'}" aria-label="${light ? 'מעבר למצב לילה' : 'מעבר למצב יום'}">${light ? ICON_MOON : ICON_SUN}</button>`;
  }
  function toggleTheme(){
    const next = curTheme() === 'light' ? 'dark' : 'light';
    const root = document.documentElement;
    root.classList.add('theme-anim');
    root.setAttribute('data-theme', next);
    setTimeout(() => root.classList.remove('theme-anim'), 400);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', next === 'light' ? '#f7f3ea' : '#0f1a14');
    const b = document.getElementById('themeBtn');
    if (b) b.outerHTML = themeBtnHtml();
    showToast(next === 'light' ? 'מצב יום' : 'מצב לילה');
  }

  // ====== דף הבית ======
  let homeFilter = 'all';   // הכל / פרשות / מועדים / עיון
  function greeting(){
    const h = new Date().getHours();
    return h >= 5 && h < 12 ? 'בוקר טוב' : h >= 12 && h < 17 ? 'צהריים טובים' : h >= 17 && h < 21 ? 'ערב טוב' : 'לילה טוב';
  }
  const isMoed = s => chumashOf(s.pageKey) === 'מועדים';

  function renderShelf(){
    const pills = [['all','הכל'], ['parashot','פרשות'], ['moadim','מועדים'], ['iyun','עיון']];
    let html = `<div class="home-top"><div><div class="greet">${greeting()}</div>
        <div class="greet-s">שיעורי פרשה ומועדים<br>${RABBI}</div></div><span class="home-side">${themeBtnHtml()}<span class="avatar" aria-hidden="true"></span></span></div>
      <div class="pills">${pills.map(p => `<button class="pill${homeFilter === p[0] ? ' on' : ''}" data-hf="${p[0]}">${p[1]}</button>`).join('')}</div>
      <div id="installSlot">${installHtml()}</div>`;
    if (setupMode) html += `<div class="empty-box" style="margin-top:18px">האתר עדיין בהקמה — השיעורים יעלו בקרוב בעז"ה.</div>`;

    // עיון: רשימה של כל שיעורי העיון
    if (homeFilter === 'iyun'){
      const all = Object.values(byPath).filter(s => s.isIyun).sort((a, b) => yearValue(b.year) - yearValue(a.year));
      html += `<div class="sec"><h3>שיעורי עיון</h3></div>`;
      html += all.length ? all.map(s => shiurRowHtml(s, s.pageKey, false, false, true)).join('') : `<div class="empty-box">עדיין אין שיעורי עיון</div>`;
      app.innerHTML = html;
      return;
    }
    const fit = s => homeFilter === 'all' || (homeFilter === 'moadim' ? isMoed(s) : !isMoed(s));

    const cont = lastInProgress();
    if (cont && fit(cont)){
      const st = cardState(cont.path);
      html += `<div class="cont" data-path="${escAttr(cont.path)}"><div class="cont-in">
          <div><div class="cont-tag">המשך האזנה</div><div class="cont-t">${keyLabel(cont.pageKey)}</div>
          <div class="shiur-meta">${shiurDetail(cont)} · ${st.meta}</div></div>
          <button class="play-btn" aria-label="${st.playing ? 'השהה' : 'נגן'}">${st.playing ? iconPause(20) : iconPlay(20)}</button>
        </div><span class="shiur-bar"><i style="width:${st.pct}%"></i></span></div>`;
    }

    const r = recentGroups();
    const isDone = s => (getProg(s.path) || {}).done ? 1 : 0;
    const items = [].concat(...r.dates.map(d => r.groups[d])).filter(fit).sort((a, b) => isDone(a) - isDone(b)).slice(0, 12);
    if (items.length){
      html += `<div class="sec"><h3>${r.thisWeek ? 'חדש השבוע' : 'העלאות אחרונות'}</h3><button class="link" data-go="recent">הכל</button></div><div class="shelf">`;
      for (const s of items){
        const st = cardState(s.path);
        html += `<div class="tile${st.done ? ' is-done' : ''}" data-path="${escAttr(s.path)}">
          ${shiurCover(s, '', 23, true)}
          <button class="play-btn" aria-label="${st.playing ? 'השהה' : 'נגן'}">${st.playing ? iconPause(16) : iconPlay(16)}</button>
          <div class="tile-t">${keyLabel(s.pageKey)}</div>
          <div class="tile-s">${st.done ? '✓ נשמע' : 'חדש' + (st.meta && !st.playing ? ' · ' + st.meta : '')}</div>
        </div>`;
      }
      html += '</div>';
    }

    // הארכיון: במועדים - רשימת המועדים עצמם; אחרת - החומשים
    if (homeFilter === 'moadim'){
      html += `<div class="sec"><h3>כל המועדים</h3></div>` + pageRowsHtml(CHUMASHIM.find(c => c.name === 'מועדים'));
    } else {
      html += `<div class="sec"><h3>הארכיון</h3><span class="link">${nShiurim(totalCount())}</span></div><div class="arch">`;
      for (const c of CHUMASHIM){
        if (homeFilter === 'parashot' && c.name === 'מועדים') continue;
        let count = 0;
        for (const key of pageKeysOf(c)) count += (index[key] || []).length;
        html += `<button class="vol${count ? '' : ' empty'}" data-chumash="${c.name}">${coverHtml(c.name, '', '', 'plain')}
          <span><div class="vol-n">${chumashLabel(c.name)}</div><div class="vol-c">${count ? nShiurim(count) : 'בקרוב'}</div></span></button>`;
      }
      html += '</div>';
    }
    app.innerHTML = html;
  }

  // ====== חדש השבוע ======
  // לפי uploads.json, שסקריפט ההעלאה מעדכן בכל העלאה רגילה (עם מייל).
  // העלאת השלמות ("העלה בלי מייל") לא נרשמת שם, ולכן לא מופיעה כאן.
  // מוצג מה שעלה ב-7 הימים האחרונים; אם לא עלה כלום - ההעלאה האחרונה.
  function parseDay(d){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }

  function recentGroups(){
    const groups = {};   // תאריך -> [שיעור,...]
    for (const path in uploadDates){
      const s = byPath[path], day = parseDay(uploadDates[path]);
      if (s && day) (groups[uploadDates[path]] = groups[uploadDates[path]] || []).push(s);
    }
    const dates = Object.keys(groups).sort().reverse();
    if (!dates.length) return { dates: [], groups, thisWeek: false };
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const weekAgo = new Date(today.getTime() - 6 * 24 * 3600 * 1000);
    const week = dates.filter(d => parseDay(d) >= weekAgo);
    return week.length ? { dates: week, groups, thisWeek: true } : { dates: [dates[0]], groups, thisWeek: false };
  }

  function renderRecent(){
    const r = recentGroups();
    let html = `<div class="page-top"><h2 class="ptitle">${r.thisWeek || !r.dates.length ? 'חדש השבוע' : 'העלאות אחרונות'}</h2>
      <p class="psub">${r.thisWeek ? 'שיעורים שעלו לאתר בשבוע האחרון' : (r.dates.length ? 'השבוע לא עלו שיעורים חדשים - זו ההעלאה האחרונה' : '')}</p></div>`;
    if (!r.dates.length) html += `<div class="empty-box">אין עדיין מידע על העלאות</div>`;
    for (const d of r.dates){
      html += `<div class="sub-h">${parseDay(d).toLocaleDateString('he-IL', { weekday:'long', day:'numeric', month:'long' })}</div>`;
      // שיעורים שכבר נשמעו - בסוף, עם הסימון שלהם
      const isDone = s => (getProg(s.path) || {}).done ? 1 : 0;
      const list = r.groups[d].slice().sort((a, b) => isDone(a) - isDone(b) || a.path.localeCompare(b.path));
      for (const s of list) html += shiurRowHtml(s, s.pageKey, false, false, true);
    }
    app.innerHTML = html;
  }

  // ====== הרשימה שלי ======
  function renderList(){
    const saved = savedList(), cont = continueList(), heard = heardList();
    let html = `<div class="page-top"><h2 class="ptitle">הרשימה שלי</h2><p class="psub">נשמר במכשיר הזה בלבד</p></div>`;
    if (!saved.length && !cont.length && !heard.length){
      html += `<div class="empty-box">הרשימה ריקה.<br>לחצו על סימן השמירה ${ICON_BM} ליד שיעור כדי להוסיף אותו לכאן.</div>`;
    }
    if (saved.length){
      html += `<div class="list-head"><span class="sub-h">שמורים להמשך</span>
        <button class="pill-btn" id="playListBtn">${iconPlay(16)} נגן את הרשימה</button></div>`;
      for (const s of saved) html += shiurRowHtml(s, s.pageKey, false, false, true);
    }
    if (cont.length){
      html += `<div class="sub-h">המשך האזנה</div>`;
      for (const s of cont) html += shiurRowHtml(s, s.pageKey, false, false, true);
    }
    if (heard.length){
      html += `<div class="sub-h">נשמעו לאחרונה</div>`;
      for (const s of heard) html += shiurRowHtml(s, s.pageKey, false, false, true);
    }
    app.innerHTML = html;
  }

  // שורות הפרשות/המועדים של חומש, עם עטיפה קטנה לכל אחד
  function pageRowsHtml(c){
    let html = '<div class="plist">';
    for (const key of pageKeysOf(c)){
      const n = (index[key] || []).length;
      html += `<button class="prow${n ? '' : ' empty'}" data-key="${key}">${coverHtml(c.name, coverText(key), '', 'sm', 15)}
        <span class="prow-gr"><div class="prow-n">${keyLabel(key)}</div><div class="prow-s">${n ? nShiurim(n) : 'עדיין אין שיעורים'}</div></span>
        ${n ? `<span class="prow-c">${ICON_CHEV}</span>` : ''}</button>`;
    }
    return html + '</div>';
  }

  // ====== חומש ======
  function renderChumash(name){
    const c = CHUMASHIM.find(x => x.name === name);
    let count = 0;
    for (const key of pageKeysOf(c)) count += (index[key] || []).length;
    app.innerHTML = `<div class="page" style="${colorVars(name)}"><div class="tint"></div><div style="position:relative">
      ${topbar('הארכיון')}
      ${coverHtml(name, name, name === 'מועדים' ? 'חגים וימים מיוחדים' : 'חמישה חומשי תורה', 'big-cover', 36)}
      <h2 class="ptitle">${chumashLabel(name)}</h2>
      <p class="psub">${count ? nShiurim(count) : 'עדיין אין שיעורים'}</p>
      ${pageRowsHtml(c)}</div></div>`;
  }

  // שיעורי דף מסוים, מהחדש לישן (ובאותה שנה: לפי שיעור ואז לפי חלק)
  function sortedShiurim(key){
    return (index[key] || []).slice()
      .sort((a,b) => yearValue(b.year) - yearValue(a.year)
        || (a.lesson||'').localeCompare(b.lesson||'')
        || (a.part||'').localeCompare(b.part||''));
  }

  // withName: להציג גם את שם הפרשה/המועד (בדפים שמערבבים פרשות, ובנגן)
  function shiurTitle(s, key, withName){
    const namePart = withName ? itemLabel(s.name, pairLabel[s.name] || s.name) + ' · ' : (s.name === key ? '' : s.name + ' · ');
    return namePart + shiurDetail(s);
  }

  // שורת שיעור, כמו שיר באלבום: לחיצה על השורה מנגנת. withName - בדפים
  // שמערבבים פרשות: עם עטיפה קטנה ושם הפרשה
  function shiurRowHtml(s, key, hl, isTarget, withName){
    const st = cardState(s.path);
    const pdfUrl = summaryUrl(s);
    return `<div class="shiur-row${hl ? ' hl' : ''}${st.done ? ' is-done' : ''}${st.isCur ? ' playing' : ''}${st.pct > 0 ? ' started' : ''}" data-path="${escAttr(s.path)}"${isTarget ? ' id="target-year"' : ''}>
        ${withName ? shiurCover(s, 'sm', 15) : ''}
        <div class="shiur-gr">
          <div class="shiur-title">${shiurTitle(s, key, withName)}</div>
          <div class="shiur-sub"><span class="shiur-meta">${st.meta}</span>${pdfUrl ? `<a class="summary-link" href="${pdfUrl}" target="_blank" rel="noopener" title="הורד סיכום השיעור">${ICON_DOC} סיכום</a>` : ''}</div>
          <div class="shiur-bar"><i style="width:${st.pct}%"></i></div>
        </div>
        <div class="shiur-acts">
          <button class="icon-btn save-btn${st.saved ? ' on' : ''}" title="${st.saved ? 'הסר מהרשימה שלי' : 'שמור לרשימה שלי'}" aria-label="שמירה לרשימה שלי">${st.saved ? ICON_BM_ON : ICON_BM}</button>
          <button class="icon-btn more-btn" title="אפשרויות נוספות" aria-label="אפשרויות נוספות" aria-haspopup="menu">${ICON_MORE}</button>
        </div>
        <button class="play-btn" aria-label="${st.playing ? 'השהה' : 'נגן'}">${st.playing ? iconPause(18) : iconPlay(18)}</button>
      </div>`;
  }

  // ====== דף פרשה (כמו דף אלבום) ======
  function filteredShiurim(key){
    const f = parashaFilter.key === key ? parashaFilter.val : 'all';
    return sortedShiurim(key).filter(s => f === 'all' || (f === 'iyun' ? s.isIyun : s.year === f));
  }
  // הכפתור הגדול: השיעור הראשון שעוד לא נשמע (או הראשון בכלל)
  function playParasha(key){
    const list = filteredShiurim(key);
    const next = list.find(s => !(getProg(s.path) || {}).done) || list[0];
    if (next) playShiur(next.path);
  }
  function renderParasha(key){
    const chumash = chumashOf(key);
    const all = sortedShiurim(key);
    if (parashaFilter.key !== key) parashaFilter = { key, val:'all' };
    const years = [...new Set(all.map(s => s.year))];
    const hasIyun = all.some(s => s.isIyun);
    const f = parashaFilter.val;
    const shiurim = filteredShiurim(key);
    const playingHere = current && current.s.pageKey === key && !audio.paused;
    let html = `<div class="page" style="${colorVars(chumash)}"><div class="tint"></div><div style="position:relative">
      ${topbar(chumashLabel(chumash))}
      ${coverHtml(chumash, coverText(key), chumashLabel(chumash), 'big-cover', 38)}
      <h2 class="ptitle">${keyLabel(key)}</h2>
      <p class="psub">${all.length ? `${nShiurim(all.length)}${years.length > 1 ? ' · ' + years.length + ' שנים' : ''}` : 'עדיין אין שיעורים'}</p>`;
    if (all.length){
      html += `<div class="ctl"><div class="ctl-l"><button class="icon-btn" id="shareParasha" title="העתק קישור" aria-label="העתק קישור לדף">${ICON_SHARE}</button></div>
        <button class="big-play" id="playParasha" aria-label="${playingHere ? 'השהה' : 'נגן'}">${playingHere ? iconPause(26) : iconPlay(26)}</button></div>`;
    }
    // סינון - רק כשיש באמת מה לסנן (יותר משנה אחת, או שיעורי עיון)
    if (years.length > 1 || (hasIyun && all.length > 1)){
      html += `<div class="chips"><button class="chip${f === 'all' ? ' on' : ''}" data-f="all">הכל</button>`;
      for (const y of years) html += `<button class="chip${f === y ? ' on' : ''}" data-f="${y}">${yearDisplay(y)}</button>`;
      if (hasIyun) html += `<button class="chip${f === 'iyun' ? ' on' : ''}" data-f="iyun">עיון</button>`;
      html += '</div>';
    }
    if (!all.length) html += `<div class="empty-box">אין עדיין שיעורים ל${itemNounOf(key)}</div>`;
    let marked = false;
    for (const s of shiurim){
      const hl = view.year && s.year === view.year;
      html += shiurRowHtml(s, key, hl, hl && !marked);
      if (hl) marked = true;
    }
    app.innerHTML = html + '</div></div>';
    const target = document.getElementById('target-year');
    if (target && f === 'all') setTimeout(() => target.scrollIntoView({ behavior:'smooth', block:'center' }), 100);
  }

  function renderError(){
    app.innerHTML = `<div class="page-top"><h2 class="ptitle">שגיאה</h2></div>
      <div class="empty-box">שגיאה בטעינת רשימת השיעורים.<br>בדקו את החיבור לאינטרנט ונסו לרענן.</div>`;
  }

  function scrollTop(){ window.scrollTo({ top:0 }); }

  // ====== חיפוש ======
  // האם q מתאים לתחילת מילה כלשהי בשם ("כי" -> "כי תשא", "מות" -> "אחרי מות")
  function wordPrefixMatch(name, q){
    if (!q) return false;
    const positions = [0];
    for (let i = 0; i < name.length; i++) if (name[i] === ' ') positions.push(i + 1);
    return positions.some(p => name.slice(p).startsWith(q));
  }

  // שמות החיפוש של כל דף: הדף עצמו + חברי הזוג ("פקודי" מוצא את ויקהל-פקודי)
  function searchNamesOf(key){
    const names = [key];
    for (const p of PAIRS){ if (p[0] + ' ' + p[1] === key){ names.push(p[0], p[1]); } }
    return names;
  }

  function isYearToken(t){
    return /^ת[שת]/.test(t) && t.length >= 2 && t.length <= 5 && yearValue(t) > 0;
  }

  // פירוש הקלט: קודם מנסים הכל כשם פרשה; אם אין התאמות והטוקן האחרון נראה כשנה - שם + שנה
  function interpretQuery(raw){
    let tokens = raw.replace(/["'״׳]/g, '').trim().split(/\s+/).filter(Boolean);
    if (tokens[0] === 'פרשת' || tokens[0] === 'מועד') tokens = tokens.slice(1);
    if (!tokens.length) return null;
    const asName = tokens.join(' ');
    const keysWithContent = Object.keys(index).filter(k => index[k].length);
    const matchA = keysWithContent.filter(k => searchNamesOf(k).some(n => wordPrefixMatch(n, asName)));
    if (matchA.length) return { keys: matchA, year: null };
    if (tokens.length >= 2 && isYearToken(tokens[tokens.length - 1])){
      const yearQ = tokens[tokens.length - 1];
      const nameQ = tokens.slice(0, -1).join(' ');
      const matchB = keysWithContent.filter(k => searchNamesOf(k).some(n => wordPrefixMatch(n, nameQ)));
      if (matchB.length) return { keys: matchB, year: yearQ };
    }
    return { keys: [], year: null };
  }

  let lastQuery = '';
  function renderSearch(){
    app.innerHTML = `<div class="page-top"><h2 class="ptitle">חיפוש</h2></div>
      <div class="search-box">${ICON_SEARCH}<input type="search" class="search-input" id="searchInput" placeholder="פרשה או מועד, אפשר גם עם שנה" autocomplete="off" enterkeyhint="search"></div>
      <div id="searchResults"></div>`;
    const input = document.getElementById('searchInput');
    input.value = lastQuery;
    input.addEventListener('input', () => { lastQuery = input.value; searchResults(); });
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const first = document.querySelector('#searchResults .prow');
      if (first) first.click();
    });
    searchResults();
    setTimeout(() => input.focus(), 50);
  }

  // תוצאות: בלי חיפוש - כל הדפים שיש בהם שיעורים, לפי סדר החומשים
  function searchResults(){
    const box = document.getElementById('searchResults');
    const res = interpretQuery(lastQuery);
    let rows = [];
    if (!res){
      for (const c of CHUMASHIM) for (const key of pageKeysOf(c)){
        const n = (index[key] || []).length;
        if (n) rows.push({ key, sub: chumashLabel(c.name) + ' · ' + nShiurim(n) });
      }
    } else {
      for (const key of res.keys){
        const ch = chumashLabel(chumashOf(key));
        if (res.year){
          // שורה לכל שנה תואמת בדף הזה
          [...new Set(index[key].map(s => s.year))].filter(y => y.startsWith(res.year))
            .sort((a,b) => yearValue(b) - yearValue(a))
            .forEach(y => rows.push({ key, year: y, sub: ch + ' · ' + yearDisplay(y) }));
        } else rows.push({ key, sub: ch + ' · ' + nShiurim(index[key].length) });
      }
    }
    if (!rows.length){ box.innerHTML = `<div class="empty-box">לא נמצאה התאמה</div>`; return; }
    box.innerHTML = `<div class="plist">${rows.slice(0, 40).map(r => `<button class="prow" data-key="${r.key}"${r.year ? ` data-year="${r.year}"` : ''}>
      ${coverHtml(chumashOf(r.key), coverText(r.key), '', 'sm', 15)}
      <span class="prow-gr"><div class="prow-n">${keyLabel(r.key)}</div><div class="prow-s">${r.sub}</div></span>
      <span class="prow-c">${ICON_CHEV}</span></button>`).join('')}</div>`;
  }

  // ====== התקנת האפליקציה ======
  // אנדרואיד/מחשב (כרום): הדפדפן מאפשר כפתור התקנה (beforeinstallprompt).
  // אייפון: אין כפתור כזה - מציגים הסבר קצר ("שיתוף" ← "הוסף למסך הבית").
  // לא מוצג כשכבר פתוחים כאפליקציה, או אחרי שסגרו את ההצעה.
  let installEvt = null;
  const INSTALL_KEY = 'parasha:installDismissed';
  const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function installDismissed(){ try { return !!localStorage.getItem(INSTALL_KEY); } catch (e) { return false; } }
  function installHtml(){
    if (isStandalone() || installDismissed() || !(installEvt || isIOS)) return '';
    const sub = installEvt ? 'גישה מהירה ממסך הבית, במסך מלא' : 'בספארי: כפתור השיתוף ⎋ ואז "הוסף למסך הבית"';
    return `<div class="install"><img src="icons/icon-192.png" alt="">
      <div class="install-gr"><div class="install-t">התקינו את האפליקציה</div><div class="install-s">${sub}</div></div>
      ${installEvt ? '<button class="install-go" id="installGo">התקנה</button>' : ''}
      <button class="install-x" id="installX" aria-label="סגור">${ICON_X}</button></div>`;
  }
  function refreshInstall(){ const slot = document.getElementById('installSlot'); if (slot) slot.innerHTML = installHtml(); }
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; refreshInstall(); });
  window.addEventListener('appinstalled', () => { installEvt = null; refreshInstall(); showToast('האפליקציה הותקנה'); });
  function doInstall(){
    if (!installEvt) return;
    installEvt.prompt();
    installEvt.userChoice.finally(() => { installEvt = null; refreshInstall(); });
  }
  function dismissInstall(){ try { localStorage.setItem(INSTALL_KEY, '1'); } catch (e) {} refreshInstall(); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  // ====== טעינה ======
  function load(){
    if (R2_BASE.indexOf('PASTE_') === 0){
      setupMode = true;
      view = { type:'shelf' }; render();
      return Promise.resolve(true);
    }
    const versionsReq = fetch('pdf-versions.json?t=' + Date.now())
      .then(r => r.ok ? r.json() : {})
      .catch(() => ({}));
    const uploadsReq = fetch('uploads.json?t=' + Date.now())
      .then(r => r.ok ? r.json() : {})
      .catch(() => ({}));
    return Promise.all([fetch('list.json?t=' + Date.now())
      .then(r => {
        if (r.status === 404) return [];   // הרשימה טרם נוצרה - מצב הקמה
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      }), versionsReq, uploadsReq])
      .then(([files, versions, uploads]) => {
        pdfVersions = versions || {};
        uploadDates = uploads || {};
        byPath = {};
        if (!files.length) setupMode = true;
        index = {}; unmatched = []; pdfPaths = new Set();
        for (const path of files){
          // קבצי סיכום PDF לא עוברים דרך parseFilename - הם נשמרים בצד
          // כדי לבדוק בהמשך אם יש סיכום זמין לכל שיעור (אותו נתיב, סיומת שונה)
          if (/\.pdf$/i.test(path)){ pdfPaths.add(path); continue; }
          const s = parseFilename(path);
          if (s){ (index[s.pageKey] = index[s.pageKey] || []).push(s); byPath[path] = s; }
          else unmatched.push(path);
        }
        // התצוגה נקבעת לפי הכתובת - כך עובדים קישורים ישירים
        // (?parasha=...&year=..., ?new=1, ?list=1) ורענון הדף בכל עומק ניווט
        updateBadges();
        view = viewFromUrl();
        render();
        return true;
      })
      .catch(() => { view = { type:'error' }; render(); return false; });
  }

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ספארי באייפון מתעלם מ-user-scalable=no, אז חוסמים את מחוות הצביטה ישירות
  ['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive:false }));
  // (הגדלה בהקשה כפולה נחסמת ב-touch-action של html, בלי לפגוע בלחיצות מהירות)

  load();
})();
</script>
</body>
</html>
