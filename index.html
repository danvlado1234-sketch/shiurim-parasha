<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיעורי פרשת שבוע ומועדים · מאת הרה"ג רבי יצחק ולדומירסקי שליט"א</title>

<meta property="og:type" content="website">

<meta property="og:site_name" content="שיעורי פרשת שבוע ומועדים">
<meta property="og:title" content="שיעורי פרשת שבוע ומועדים · הרה&quot;ג רבי יצחק ולדומירסקי שליט&quot;א">
<meta property="og:description" content="האזנה חינם לשיעורי פרשת השבוע ומועדי ישראל, לפי חומש, פרשה ומועד, מכל השנים.">

<meta property="og:image:width" content="2000">
<meta property="og:image:height" content="1500">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f5efdf; --ink:#26211a; --accent:#1f4a33; /* ירוק עמוק - הצבע המבחין של אתר הפרשות */
    --accent-soft:#2c5c42; --brass:#a1782f; --line:#d8cbaa; --muted:#7a7061;
    --shadow-sm: 0 1px 3px rgba(38,33,26,0.08);
    --shadow-md: 0 6px 16px rgba(38,33,26,0.14);
    --shadow-accent: 0 8px 18px rgba(31,74,51,0.24);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Heebo',sans-serif; background:var(--paper); color:var(--ink);
    min-height:100vh;
    background-image:
      linear-gradient(0deg, rgba(31,74,51,.05) 1px, transparent 1px),
      linear-gradient(180deg, rgba(18,13,9,0.55) 0%, rgba(24,17,12,0.4) 45%, rgba(245,239,223,0.95) 100%),
      url('bg-rabbi.jpg');
    background-size:100% 46px, cover, cover;
    background-position: top, 42% 32%, 42% 32%;
    background-repeat: repeat, no-repeat, no-repeat;
    background-attachment: scroll, fixed, fixed;
  }
  .wrap { max-width:760px; margin:0 auto; padding:28px 18px 80px; }

  header.hero { text-align:center; padding:24px 20px 16px; margin-bottom:16px; }
  header.hero h1 { font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:clamp(30px,7vw,44px); color:#f6ecd3; text-shadow:0 2px 12px rgba(20,14,8,0.45); }
  header.hero .byline { font-family:'Frank Ruhl Libre',serif; font-size:clamp(16px,4vw,20px); margin-top:6px; color:#f0e6c8; text-shadow:0 1px 8px rgba(20,14,8,0.4); }
  .ornament { display:flex; justify-content:center; color:#d9b876; opacity:.9; margin:10px 0 4px; }
  header.hero .meta { margin-top:10px; font-size:14px; color:#e7dcc0; }

  .shelf { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:14px; }
  .volume {
    font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:19px;
    padding:22px 10px 16px; text-align:center; cursor:pointer;
    background:linear-gradient(180deg,#fbf7ea, #f1e9d2);
    border:1px solid var(--line); border-top:6px solid var(--accent);
    border-radius:4px; color:var(--ink);
    box-shadow:0 2px 0 rgba(38,33,26,.12), var(--shadow-sm);
    transition:transform .18s cubic-bezier(.22,.8,.25,1), box-shadow .18s ease, border-top-color .18s ease;
    animation: volumeIn .32s cubic-bezier(.22,.8,.25,1) both;
  }
  .volume .count { display:block; font-family:'Heebo',sans-serif; font-weight:400; font-size:12.5px; color:var(--muted); margin-top:6px; }
  .volume:hover { border-top-color:var(--brass); transform:translateY(-4px) scale(1.02); box-shadow:0 2px 0 rgba(38,33,26,.12), var(--shadow-accent); }
  .volume.empty { border-top-color:var(--line); }
  .volume.empty:hover { border-top-color:var(--muted); box-shadow:0 2px 0 rgba(38,33,26,.12), var(--shadow-sm); }
  .volume:focus-visible { outline:3px solid var(--brass); outline-offset:2px; }

  @keyframes volumeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes rowIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeSlideIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  #app.fade-in { animation: fadeSlideIn .28s ease both; }

  @media (prefers-reduced-motion: reduce) {
    .volume, .parasha-row, .shiur-row, #app.fade-in { animation:none !important; transition:none !important; }
  }

  .breadcrumb { margin-bottom:18px; display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
  .breadcrumb button {
    font-family:'Heebo',sans-serif; font-size:14.5px; cursor:pointer;
    background:#fbf7ea; border:1px solid var(--line); border-radius:20px;
    padding:8px 16px; color:var(--accent);
    box-shadow:var(--shadow-sm);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .breadcrumb button:hover { border-color:var(--accent); box-shadow:var(--shadow-md); }
  .breadcrumb button:focus-visible { outline:2px solid var(--brass); outline-offset:2px; }
  .breadcrumb .home-link { display:inline-flex; align-items:center; gap:4px; color:var(--ink); }
  .breadcrumb .home-link:hover { color:var(--accent); border-color:var(--accent); }
  .breadcrumb-sep { color:var(--ink); font-size:12px; }

  h2.page-title { font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:clamp(26px,6vw,34px); color:#f6ecd3; margin-bottom:4px; text-shadow:0 2px 10px rgba(20,14,8,0.5); }
  .page-sub { color:#e7dcc0; font-size:14.5px; margin-bottom:20px; text-shadow:0 1px 6px rgba(20,14,8,0.4); }

  .parasha-list { display:flex; flex-direction:column; gap:10px; }
  .parasha-row {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:19px;
    padding:15px 18px; cursor:pointer; text-align:right;
    background:#fbf7ea; border:1px solid var(--line); border-right:6px solid var(--accent);
    border-radius:4px; color:var(--ink); width:100%;
    box-shadow:var(--shadow-sm);
    transition:transform .18s cubic-bezier(.22,.8,.25,1), box-shadow .18s ease, border-right-color .18s ease;
    animation: volumeIn .32s cubic-bezier(.22,.8,.25,1) both;
  }
  .parasha-row .count { font-family:'Heebo',sans-serif; font-weight:400; font-size:13px; color:var(--muted); flex-shrink:0; }
  .parasha-row:hover { border-right-color:var(--brass); transform:translateY(-3px); box-shadow:var(--shadow-md); }
  .parasha-row.empty { border-right-color:var(--line); }
  .parasha-row.empty:hover { transform:translateY(-2px); box-shadow:var(--shadow-sm); }
  .parasha-row:focus-visible { outline:3px solid var(--brass); outline-offset:2px; }

  .shiur-row {
    background:#fbf7ea; border:1px solid var(--line); border-right:4px solid var(--brass);
    border-radius:6px; padding:14px 16px 0; margin-bottom:14px; overflow:hidden;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .18s ease, border-right-color .18s ease;
    animation: rowIn .3s ease both;
  }
  .shiur-row:hover { box-shadow:var(--shadow-md); border-right-color:var(--accent); }
  .shiur-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .shiur-title { font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:19px; color:var(--accent); }
  .share-btn {
    all:unset; cursor:pointer; display:inline-flex; align-items:center;
    color:var(--muted); padding:4px; border-radius:4px;
    transition:color .15s ease, background .15s ease;
  }
  .share-btn:hover { color:var(--accent); background:rgba(31,74,51,0.08); }
  a.share-btn { text-decoration:none; }
  .share-btn:focus-visible { outline:2px solid var(--brass); outline-offset:1px; }
  .shiur-actions { display:inline-flex; align-items:center; gap:6px; flex-shrink:0; }
  .shiur-actions .text-link {
    display:inline-flex; align-items:center; gap:4px;
    font-size:12.5px; color:var(--accent); text-decoration:none;
    border:1px solid var(--accent); border-radius:20px; padding:3px 10px;
    transition:background .15s ease, color .15s ease;
  }
  .shiur-actions .text-link:hover { background:var(--accent); color:var(--paper); }
  /* כרטיס שיעור: שורת מידע (התקדמות / נשמע), פס התקדמות דק בתחתית, כפתור ניגון */
  .shiur-sub { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0 10px; flex-wrap:wrap; }
  .shiur-meta { font-size:12.5px; color:var(--muted); }
  .shiur-meta .done { color:#2e7d4f; font-weight:700; }
  .shiur-bar { height:4px; background:#ece3c9; margin:0 -16px; }
  .shiur-bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s linear; }
  .shiur-row.is-done .shiur-bar i { background:#9bb8a5; }
  .shiur-row.playing { border-right-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
  .play-btn {
    width:42px; height:42px; border-radius:50%; border:0; cursor:pointer; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--accent); color:#fff; box-shadow:var(--shadow-sm);
    transition:transform .12s ease, background .15s ease;
  }
  .play-btn:hover { background:var(--accent-soft); transform:scale(1.06); }
  .play-btn:focus-visible { outline:3px solid var(--brass); outline-offset:2px; }
  .save-btn { all:unset; cursor:pointer; display:inline-flex; align-items:center; color:var(--muted); padding:4px; border-radius:50%; }
  .save-btn:hover { color:var(--brass); }
  .save-btn.on { color:var(--brass); }
  .save-btn:focus-visible { outline:2px solid var(--brass); outline-offset:1px; }
  .list-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:18px 0 10px; }
  .list-head .recent-date { margin:0; }
  .heard-btn { all:unset; cursor:pointer; display:inline-flex; align-items:center; color:var(--line); padding:4px; border-radius:50%; }
  .heard-btn:hover { color:var(--muted); }
  .heard-btn.on { color:#2e7d4f; }
  .heard-btn:focus-visible { outline:2px solid var(--brass); outline-offset:1px; }

  /* ====== נגן קבוע בתחתית המסך ====== */
  .player {
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:var(--accent); color:#f6ecd3; box-shadow:0 -6px 22px rgba(0,0,0,.28);
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .player-in { max-width:760px; margin:0 auto; }
  .player-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .player-title { all:unset; cursor:pointer; font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:16px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .player-title:hover { text-decoration:underline; }
  .player-title:focus-visible { outline:2px solid #d9b876; outline-offset:2px; }
  .player-side { display:inline-flex; align-items:center; gap:8px; flex-shrink:0; }
  .player-speed {
    font-family:'Heebo',sans-serif; font-size:12.5px; font-weight:600; cursor:pointer; direction:ltr;
    color:#f6ecd3; background:none; border:1px solid rgba(246,236,211,.5); border-radius:14px; padding:2px 9px;
  }
  .player-speed.fast { background:#d9b876; color:var(--accent); border-color:#d9b876; }
  .player-close { all:unset; cursor:pointer; opacity:.75; display:inline-flex; padding:4px; }
  .player-close:hover { opacity:1; }
  .player-seek { width:100%; margin:8px 0 0; accent-color:#d9b876; cursor:pointer; }
  .player-times { display:flex; justify-content:space-between; font-size:11.5px; opacity:.8; font-variant-numeric:tabular-nums; }
  .player-ctrl { display:flex; justify-content:center; align-items:center; gap:26px; margin-top:2px; }
  .player-ctrl button { all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; }
  .player-ctrl button:focus-visible { outline:2px solid #d9b876; outline-offset:2px; }
  .player-ctrl .player-skip { width:40px; height:40px; opacity:.9; }
  .player-ctrl .player-skip:hover { opacity:1; }
  .player-ctrl .player-main { width:46px; height:46px; background:#f6ecd3; color:var(--accent) !important; }
  body.has-player .wrap { padding-bottom:180px; }
  body.has-player .toast { bottom:170px; }

  .toast {
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(16px);
    background:var(--ink); color:var(--paper); padding:11px 22px; border-radius:22px;
    font-size:14px; font-weight:600; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 10px 24px rgba(0,0,0,0.28); z-index:50;
    max-width:calc(100vw - 40px); text-align:center;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .search-row { position:relative; margin-bottom:24px; }
  .search-icon {
    position:absolute; top:50%; right:18px; transform:translateY(-50%);
    color:var(--muted); pointer-events:none;
  }
  .search-input {
    width:100%; box-sizing:border-box; font-family:'Heebo',sans-serif; font-size:16px;
    padding:13px 46px 13px 18px; border:1px solid var(--line); border-radius:24px;
    background:#fbf7ea; color:var(--ink);
    transition:border-color .15s ease;
  }
  .search-input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  .suggest {
    position:absolute; top:calc(100% + 6px); right:0; left:0; z-index:6;
    background:#fbf7ea; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 10px 26px rgba(38,33,26,.18); overflow:hidden;
  }
  .suggest button {
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    width:100%; padding:12px 18px; cursor:pointer; text-align:right;
    font-family:'Heebo',sans-serif; font-size:16px; color:var(--ink);
    background:none; border:0; border-bottom:1px solid var(--line);
  }
  .suggest button:last-child { border-bottom:0; }
  .suggest button:hover, .suggest button.active { background:rgba(31,74,51,.08); }
  .suggest .yr { color:var(--muted); font-size:13.5px; flex-shrink:0; }
  .suggest .none { padding:12px 18px; color:var(--muted); font-size:14.5px; }
  .shiur-row.hl { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }

  /* כפתור "חדש השבוע" - במקום שבו היה "בדוק שיעורים חדשים" */
  .recent-row { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .recent-btn {
    display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    font-family:'Heebo',sans-serif; font-size:14px; font-weight:600; color:var(--accent);
    background:#fbf7ea; border:1px solid var(--accent); padding:7px 16px; border-radius:20px;
    box-shadow:var(--shadow-sm);
    transition:background .15s ease, color .15s ease;
  }
  .recent-btn:hover { background:var(--accent); color:var(--paper); }
  .recent-btn:focus-visible { outline:2px solid var(--brass); outline-offset:2px; }
  .recent-badge {
    min-width:20px; height:20px; padding:0 6px; border-radius:10px; font-size:12px;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--brass); color:#fff;
  }
  .recent-date { font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:17px; color:#f6ecd3; margin:18px 0 10px; text-shadow:0 1px 6px rgba(20,14,8,0.5); }

  .no-content, .note {
    background:#fbf7ea; border:1px dashed var(--line); border-radius:6px;
    padding:22px; text-align:center; color:var(--muted); font-size:15px; line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1 id="siteTitle">שיעורי פרשת שבוע ומועדים</h1>
    <p class="byline">מאת הרה"ג רבי יצחק ולדומירסקי שליט"א</p>
    <div class="ornament" aria-hidden="true">
      <svg viewBox="0 0 220 20" width="180" height="18">
        <line x1="0" y1="10" x2="85" y2="10" stroke="currentColor" stroke-width="1"></line>
        <path d="M110 1 L119 10 L110 19 L101 10 Z" fill="currentColor"></path>
        <line x1="135" y1="10" x2="220" y2="10" stroke="currentColor" stroke-width="1"></line>
      </svg>
    </div>
    <p class="meta" id="headerMeta">טוען…</p>
  </header>
  <div class="recent-row" id="recentRow" hidden>
    <button class="recent-btn" id="recentBtn"></button>
    <button class="recent-btn" id="listBtn"></button>
  </div>
  <div class="search-row">
    <svg class="search-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" class="search-input" id="searchInput" placeholder="פרשה או מועד, למשל: נח תשפה" autocomplete="off">
    <div class="suggest" id="suggest" hidden></div>
  </div>
  <div id="app"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="player" id="player" hidden>
  <div class="player-in">
    <div class="player-top">
      <button class="player-title" id="playerTitle" title="לדף השיעור"></button>
      <span class="player-side">
        <button class="player-speed" id="playerSpeed" title="מהירות השמעה"></button>
        <button class="player-close" id="playerClose" title="סגור את הנגן" aria-label="סגור את הנגן"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </span>
    </div>
    <input type="range" class="player-seek" id="playerSeek" min="0" max="1000" value="0" aria-label="מיקום בשיעור">
    <div class="player-times"><span id="playerCur">0:00</span><span id="playerDur">0:00</span></div>
    <div class="player-ctrl">
      <button class="player-skip" id="playerBack" title="15 שניות אחורה" aria-label="15 שניות אחורה"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.5" font-size="7.5" font-family="Heebo,sans-serif" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">15</text></svg></button>
      <button class="player-main" id="playerPlay" aria-label="נגן / השהה"></button>
      <button class="player-skip" id="playerFwd" title="15 שניות קדימה" aria-label="15 שניות קדימה"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.5" font-size="7.5" font-family="Heebo,sans-serif" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">15</text></svg></button>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>
</div>

<script>
(function(){
  // ====== הגדרות ======
  // כתובת הענן הציבורית של דלי הפרשות. עד שהדלי נוצר - האתר יציג הודעת הקמה.
  const R2_BASE = "https://pub-c502103793ec448b9964b8779d053cd4.r2.dev";

  // ====== האמת הקבועה: פרשות, סדר, ושיוך לחומש ======
  const CHUMASHIM = [
    { name:'בראשית', parashot:['בראשית','נח','לך לך','וירא','חיי שרה','תולדות','ויצא','וישלח','וישב','מקץ','ויגש','ויחי'] },
    { name:'שמות',   parashot:['שמות','וארא','בא','בשלח','יתרו','משפטים','תרומה','תצוה','כי תשא','ויקהל','פקודי'] },
    { name:'ויקרא',  parashot:['ויקרא','צו','שמיני','תזריע','מצורע','אחרי מות','קדושים','אמור','בהר','בחוקותי'] },
    { name:'במדבר',  parashot:['במדבר','נשא','בהעלותך','שלח','קרח','חוקת','בלק','פינחס','מטות','מסעי'] },
    { name:'דברים',  parashot:['דברים','ואתחנן','עקב','ראה','שופטים','כי תצא','כי תבוא','נצבים','וילך','האזינו','וזאת הברכה'] },
    // "מועדים" אינו חומש אמיתי - קבוצה מלאכותית לחגים ומועדי ישראל, באותו
    // מנגנון בדיוק (תיקייה משלה, קובץ מתחיל ב"מועד_" במקום "פרשת_"). הסדר
    // הוא סדר לוח השנה העברי, מתחילת תשרי.
    { name:'מועדים', parashot:['ראש השנה','יום כיפור','סוכות','שמחת תורה','חנוכה','עשרה בטבת','טו בשבט','תענית אסתר','פורים','פסח','לג בעומר','שבועות','שבעה עשר בתמוז','תשעה באב'] }
  ];
  // ששת הזוגות הקבועים - תמיד כפתור/דף אחד משותף
  const PAIRS = [
    ['ויקהל','פקודי'], ['תזריע','מצורע'], ['אחרי מות','קדושים'],
    ['בהר','בחוקותי'], ['מטות','מסעי'], ['נצבים','וילך']
  ];

  // מפות עזר שנגזרות מהטבלאות
  const pairKeyOf = {};   // 'מטות' -> 'מטות מסעי', 'מסעי' -> 'מטות מסעי'
  const pairLabel = {};   // 'מטות מסעי' -> 'מטות · מסעי'
  PAIRS.forEach(p => {
    const key = p[0] + ' ' + p[1];
    pairKeyOf[p[0]] = key; pairKeyOf[p[1]] = key;
    pairLabel[key] = p[0] + ' · ' + p[1];
  });
  const validNames = {};  // כל שם חוקי (יחיד או זוג) -> true
  CHUMASHIM.forEach(c => c.parashot.forEach(n => validNames[n] = true));
  Object.keys(pairLabel).forEach(k => validNames[k] = true);

  // מועד או פרשה? קובע את המילה שמוצגת לפני השם בכל מקום באתר
  const moadimNames = {};
  (CHUMASHIM.find(c => c.name === 'מועדים') || { parashot:[] }).parashot.forEach(n => moadimNames[n] = true);
  function itemNounOf(key){ return moadimNames[key] ? 'מועד זה' : 'פרשה זו'; }
  // תווית תצוגה: לפרשה מוצג "פרשת X", למועד מוצג רק "X" בלי המילה "מועד" -
  // מיותר ואפילו מוזר בתוך דף שכבר נקרא "מועדים" (למשל "מועד חנוכה" בתוך
  // עמוד מועדים). ה"מועד"/"פרשת" עדיין קיימים בשם הקובץ ובלוגיקת הפענוח -
  // זה רק עניין תצוגתי.
  function itemLabel(key, label){ return moadimNames[key] ? label : ('פרשת ' + label); }

  // ====== גימטריה לשנים (תשפו -> 786, לצורך מיון) ======
  const GEM = {'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,'כ':20,'ל':30,'מ':40,'נ':50,'ס':60,'ע':70,'פ':80,'צ':90,'ק':100,'ר':200,'ש':300,'ת':400,'ך':20,'ם':40,'ן':50,'ף':80,'ץ':90};
  function yearValue(y){ let s=0; for (const ch of y){ if (!GEM[ch]) return 0; s += GEM[ch]; } return s; }
  function yearDisplay(y){ return y.length > 1 ? y.slice(0,-1) + '"' + y.slice(-1) : y; }

  // ====== פענוח שם קובץ ======
  // פרשת_<שם>_<שנה>[_שיעור_<אות>][_חלק_<אות>][_שבת_<מילה>][_עיון].mp3/m4a
  //   "שיעור ב" = שיעור נפרד ועצמאי שני על אותה פרשה באותה שנה
  //   "חלק ב"   = המשך של אותו שיעור עצמו (הקלטה שנחתכה לשניים)
  //   "שבת <מילה>" = שבת מיוחדת (הגדול/שובה/זכור/פרה/החודש/חזון/נחמו וכו') -
  //               לשיעור ששייך תוכנית-אירועים למועד אחר (למשל שיעור על
  //               שבת הגדול משוייך לתיקיית ולשם הקובץ של פסח, לא מועד נפרד).
  //               תמיד לפני "עיון" אם שניהם קיימים.
  //   "עיון"    = דגל בלבד (בלי ערך אחריו), תמיד בסוף השם. סימון תוכן
  //               הלכתי/עיוני להבדיל מוורט (ברירת המחדל, בלי הדגל).
  // כולם אופציונליים ויכולים להופיע יחד.
  function parseFilename(path){
    const filename = path.split('/').pop();
    const base = filename.replace(/\.(mp3|m4a)$/i, '');
    let tokens = base.split('_').filter(Boolean);
    if (tokens[0] === 'פרשת' || tokens[0] === 'מועד') tokens = tokens.slice(1);
    let isIyun = false;
    if (tokens[tokens.length - 1] === 'עיון'){ isIyun = true; tokens = tokens.slice(0, -1); }
    let shabbatName = null;
    if (tokens.length >= 2 && tokens[tokens.length - 2] === 'שבת'){
      shabbatName = 'שבת ' + tokens[tokens.length - 1];
      tokens = tokens.slice(0, -2);
    }
    let part = null, lesson = null;
    const iLesson = tokens.indexOf('שיעור');
    const iPart = tokens.indexOf('חלק');
    // כל תגית נקראת עד לתגית הבאה (או עד הסוף), כדי שהסדר ביניהן לא ישנה
    if (iLesson > -1){
      const end = (iPart > iLesson) ? iPart : tokens.length;
      lesson = tokens.slice(iLesson + 1, end).join(' ');
    }
    if (iPart > -1){
      const end = (iLesson > iPart) ? iLesson : tokens.length;
      part = tokens.slice(iPart + 1, end).join(' ');
    }
    // חותכים את שם הפרשה+שנה עד התגית המוקדמת מבין השתיים
    const marks = [iLesson, iPart].filter(i => i > -1);
    if (marks.length) tokens = tokens.slice(0, Math.min.apply(null, marks));
    if (tokens.length < 2) return null;
    const year = tokens[tokens.length-1];
    const name = tokens.slice(0,-1).join(' ');
    if (!validNames[name] || !yearValue(year)) return null;
    // דף הבית של השיעור: הפרשה עצמה, או דף הזוג אם היא חלק מזוג
    const pageKey = pairLabel[name] ? name : (pairKeyOf[name] || name);
    return { path, filename, name, year, part, lesson, pageKey, isIyun, shabbatName };
  }

  // ====== מצב ======
  let index = {};      // pageKey -> [shiur,...]
  let unmatched = [];
  let pdfPaths = new Set();   // נתיבי סיכומי PDF שקיימים (אותו נתיב כמו השמע, סיומת שונה)
  let pdfVersions = {};       // נתיב PDF -> גרסה (pdf-versions.json), נוסף לקישור נגד מטמון
  let uploadDates = {};       // נתיב שמע -> תאריך העלאה (uploads.json) - רק מה שיוצג ב"חדש השבוע"
  let byPath = {};            // נתיב שמע -> השיעור המפוענח
  let view = { type:'shelf' };
  let setupMode = false;
  const app = document.getElementById('app');
  const headerMeta = document.getElementById('headerMeta');

  function chumashOf(pageKey){
    const first = pageKey.split(' · ')[0]; // לא בשימוש - ליתר ביטחון
    for (const c of CHUMASHIM){
      for (const p of c.parashot){
        if (pageKey === p || (pairKeyOf[p] === pageKey)) return c.name;
      }
    }
    return null;
  }

  function totalCount(){
    let n = 0; for (const k in index) n += index[k].length; return n;
  }

  // רשימת "כפתורי" הפרשות של חומש: זוגות מאוחדים לכפתור אחד
  function pageKeysOf(chumash){
    const keys = []; const seen = {};
    for (const p of chumash.parashot){
      const key = pairKeyOf[p] || p;
      if (!seen[key]){ seen[key] = true; keys.push(key); }
    }
    return keys;
  }

  const ICON_HOME = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10v9.5a1 1 0 0 0 1 1H9.5v-6h5v6H17.5a1 1 0 0 0 1-1V10"></path></svg>';
  const BREADCRUMB_HOME = `<button class="home-link" id="homeBtn">${ICON_HOME} לדף הבית</button><span class="breadcrumb-sep">·</span>`;

  const ICON_LINK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>';
  // הורדת השמע: אוזניות עם חץ למטה (להבדיל מ"סיכום", שהוא הורדת ה-PDF)
  const ICON_AUDIO_DL = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3z"></path><path d="M3 19a2 2 0 0 0 2 2h1v-6H3z"></path><path d="M12 9v7"></path><path d="m9 13 3 3 3-3"></path></svg>';
  const ICON_DOWNLOAD = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 11 5 5 5-5"></path><path d="M5 21h14"></path></svg>';

  // בונה קישור ישיר לפרשה+שנה מסוימת - אותה גרנולריות שתפריט ההצעות כבר תומך בה
  function directLink(key, year){
    const base = location.origin + location.pathname;
    return `${base}?parasha=${encodeURIComponent(key)}&year=${encodeURIComponent(year)}`;
  }

  function escAttr(s){ return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }

  function fallbackCopy(url){
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('הקישור הועתק'); }
    catch (e){ showToast('לא הצלחנו להעתיק — נסו שוב'); }
    document.body.removeChild(ta);
  }

  function copyLink(url){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(() => showToast('הקישור הועתק'), () => fallbackCopy(url));
    } else {
      fallbackCopy(url);
    }
  }

  // כפתורי שיתוף מטופלים בהאצלת אירוע יחידה על app, כי app.innerHTML
  // מוחלף בכל רינדור - כך לא צריך לחבר מחדש מאזין לכל כפתור בנפרד.
  app.addEventListener('click', (e) => {
    const btn = e.target.closest('.share-btn');
    if (btn) copyLink(btn.dataset.link);
    const play = e.target.closest('.play-btn');
    if (play) playShiur(play.closest('.shiur-row').dataset.path);
    const save = e.target.closest('.save-btn');
    if (save) toggleSaved(save.closest('.shiur-row').dataset.path);
    const heard = e.target.closest('.heard-btn');
    if (heard) toggleHeard(heard.closest('.shiur-row').dataset.path);
  });

  // ====== זיכרון האזנה (התקדמות, נשמע) ======
  // נשמר בדפדפן של המכשיר בלבד (localStorage), בלי משתמשים. כל הגישה עוברת
  // דרך getProg/setProg - כדי שבעתיד אפשר יהיה לחבר כאן סנכרון להרשמה
  // אופציונלית בלי לגעת בשאר הקוד. המפתחות מתחילים ב-"parasha:" כי אתר
  // המשניות יושב באותה כתובת (danvlado1234-sketch.github.io) ולכן חולק
  // את אותו אחסון - כך הם לא מתערבבים.
  // מבנה: נתיב שמע -> { t: שניות שנשמעו, d: אורך, done: נשמע, at: מתי }
  const STORE_KEY = 'parasha:progress';
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { progress = {}; }
  let saveTimer = null;
  function saveProgress(){
    clearTimeout(saveTimer); saveTimer = null;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {}
  }
  function saveSoon(){ if (!saveTimer) saveTimer = setTimeout(saveProgress, 4000); }
  function getProg(path){ return progress[path] || null; }
  function setProg(path, patch){
    const prev = progress[path] || {};
    const next = Object.assign({}, prev, patch, { at: Date.now() });
    // שיעור שנשמע יוצא מהרשימה לבד ועובר ל"נשמעו לאחרונה"
    if (next.done && !prev.done){ next.doneAt = Date.now(); next.saved = false; }
    progress[path] = next;
    saveSoon();
  }

  // ====== הרשימה שלי ======
  function listOf(pred, sortKey, desc){
    return Object.keys(progress)
      .filter(path => byPath[path] && pred(progress[path]))
      .sort((a, b) => ((progress[a][sortKey] || 0) - (progress[b][sortKey] || 0)) * (desc ? -1 : 1))
      .map(path => byPath[path]);
  }
  // שמורים להמשך - בסדר שבו נשמרו (זה סדר הניגון)
  function savedList(){ return listOf(p => p.saved && !p.done, 'savedAt', false); }
  // התחילו ולא סיימו (ולא שמורים - אלה מופיעים ברשימה עצמה)
  function continueList(){ return listOf(p => !p.saved && !p.done && p.t > 5, 'at', true).slice(0, 10); }
  function heardList(){ return listOf(p => p.done, 'doneAt', true).slice(0, 10); }

  function toggleSaved(path){
    const p = getProg(path) || {};
    // שמירה של שיעור שכבר נשמע = רוצים לשמוע שוב, אז מתחילים מההתחלה
    setProg(path, p.saved ? { saved: false } : Object.assign({ saved: true, savedAt: Date.now() }, p.done ? { done: false, t: 0 } : {}));
    saveProgress();
    refreshCards(path);
    updateRecentBtn();
    showToast(p.saved ? 'הוסר מהרשימה שלי' : 'נוסף לרשימה שלי');
  }
  const DONE_RATIO = 0.9;   // מ-90% השיעור נחשב "נשמע"

  function fmtTime(sec){
    sec = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), ss = String(sec % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
  }
  function mins(sec){ return Math.max(1, Math.round(sec / 60)); }

  // שורת המידע והפס של כרטיס, לפי מצב ההאזנה
  function cardState(path){
    const p = getProg(path) || {};
    const isCur = current && current.path === path;
    const playing = isCur && !audio.paused;
    const d = p.d || 0, t = p.t || 0;
    let meta = '';
    if (playing) meta = 'מתנגן עכשיו' + (d ? ` · ${mins(t)} מתוך ${mins(d)} דק'` : '');
    else if (p.done) meta = `<span class="done">✓ נשמע</span>${d ? ` · ${mins(d)} דק'` : ''}`;
    else if (t > 5 && d) meta = `נשמעו ${mins(t)} מתוך ${mins(d)} דק'`;
    else if (d) meta = `${mins(d)} דק'`;
    const pct = p.done ? 100 : (d ? Math.min(100, t / d * 100) : 0);
    return { meta, pct, done: !!p.done, saved: !!p.saved && !p.done, isCur, playing };
  }

  function refreshCards(path){
    app.querySelectorAll('.shiur-row').forEach(row => {
      if (path && row.dataset.path !== path) return;
      const st = cardState(row.dataset.path);
      row.querySelector('.shiur-meta').innerHTML = st.meta;
      row.querySelector('.shiur-bar i').style.width = st.pct + '%';
      row.classList.toggle('is-done', st.done);
      row.classList.toggle('playing', st.isCur);
      const sb = row.querySelector('.save-btn');
      sb.classList.toggle('on', st.saved);
      sb.innerHTML = st.saved ? ICON_BM_ON : ICON_BM;
      sb.title = st.saved ? 'הסר מהרשימה שלי' : 'שמור לרשימה שלי';
      const hb = row.querySelector('.heard-btn');
      hb.classList.toggle('on', st.done);
      hb.title = st.done ? 'בטל סימון "נשמע"' : 'סמן כנשמע';
      const pb = row.querySelector('.play-btn');
      pb.innerHTML = st.playing ? ICON_PAUSE : ICON_PLAY;
      pb.setAttribute('aria-label', st.playing ? 'השהה' : 'נגן');
    });
  }

  function toggleHeard(path){
    const p = getProg(path) || {};
    setProg(path, p.done ? { done: false, t: 0 } : { done: true });
    saveProgress();
    refreshCards(path);
    updateRecentBtn();
  }

  // ====== הנגן הקבוע ======
  // נגן אחד לכל האתר, מחוץ לאזור שמתחלף בניווט - לכן השיעור ממשיך להתנגן
  // כשעוברים בין דפים. מהירות אחת לכל השיעורים, נשמרת בין ביקורים (באייפון
  // אין בחירת מהירות בנגן המובנה).
  const audio = document.getElementById('audio');
  const playerEl = document.getElementById('player');
  const seekEl = document.getElementById('playerSeek');
  const ICON_BM = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
  const ICON_BM_ON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
  const ICON_PLAY = '<svg width="20" height="20" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
  const ICON_PAUSE = '<svg width="20" height="20" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>';
  let current = null;   // { path, s, title }
  let seeking = false;

  const SPEEDS = [1, 1.25, 1.5, 1.75, 2];
  let speed = 1;
  try { const saved = parseFloat(localStorage.getItem('playbackSpeed')); if (SPEEDS.includes(saved)) speed = saved; } catch (e) {}
  function applySpeed(){ audio.defaultPlaybackRate = speed; audio.playbackRate = speed; }
  function updateSpeedBtn(){
    const b = document.getElementById('playerSpeed');
    b.textContent = speed + '×';
    b.classList.toggle('fast', speed !== 1);
    b.setAttribute('aria-label', 'מהירות השמעה ' + speed);
  }
  document.getElementById('playerSpeed').addEventListener('click', () => {
    speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
    try { localStorage.setItem('playbackSpeed', String(speed)); } catch (e) {}
    applySpeed(); updateSpeedBtn();
  });
  updateSpeedBtn();

  function shiurUrl(s){ return R2_BASE.replace(/\/$/,'') + '/' + s.path.split('/').map(encodeURIComponent).join('/'); }

  function playShiur(path){
    if (current && current.path === path){ audio.paused ? audio.play() : audio.pause(); return; }
    const s = byPath[path];
    if (!s) return;
    if (current) rememberPosition();
    const p = getProg(path) || {};
    // ממשיכים מאיפה שעצרו - אלא אם נשמע כבר, או שנשארו רק שניות בודדות
    const start = (!p.done && p.t > 5 && !(p.d && p.d - p.t < 10)) ? Math.floor(p.t) : 0;
    // שיעור מהרשימה - בסיומו ממשיכים לבא ברשימה, כמו רשימת השמעה
    current = { path, s, title: shiurTitle(s, s.pageKey, true), fromList: !!p.saved && !p.done };
    audio.src = shiurUrl(s) + (start ? '#t=' + start : '');
    applySpeed();
    document.getElementById('playerTitle').textContent = current.title;
    document.getElementById('playerCur').textContent = fmtTime(start);
    document.getElementById('playerDur').textContent = p.d ? fmtTime(p.d) : '0:00';
    seekEl.value = p.d ? Math.round(start / p.d * 1000) : 0;
    playerEl.hidden = false;
    document.body.classList.add('has-player');
    setMediaSession();
    audio.play().catch(() => {});
    refreshCards();
  }

  function rememberPosition(){
    if (!current || !audio.duration || !isFinite(audio.duration)) return;
    const t = audio.currentTime, d = audio.duration;
    const patch = { t, d };
    if (t / d >= DONE_RATIO) patch.done = true;
    setProg(current.path, patch);
  }

  let lastUi = 0;
  audio.addEventListener('timeupdate', () => {
    if (!current) return;
    const d = audio.duration, t = audio.currentTime;
    if (!seeking && d && isFinite(d)) seekEl.value = Math.round(t / d * 1000);
    document.getElementById('playerCur').textContent = fmtTime(t);
    const now = Date.now();
    if (now - lastUi < 1000) return;   // פעם בשנייה מספיק לכרטיס ולזיכרון
    lastUi = now;
    const wasDone = !!(getProg(current.path) || {}).done;
    rememberPosition();
    refreshCards(current.path);
    if (!wasDone && (getProg(current.path) || {}).done) updateRecentBtn();
  });
  audio.addEventListener('loadedmetadata', () => {
    if (!current) return;
    document.getElementById('playerDur').textContent = fmtTime(audio.duration);
    rememberPosition();
    refreshCards(current.path);
  });
  function onPlayState(){
    const btn = document.getElementById('playerPlay');
    btn.innerHTML = audio.paused ? ICON_PLAY.replace(/20/g, '24') : ICON_PAUSE.replace(/20/g, '24');
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing';
    if (current){ rememberPosition(); saveProgress(); refreshCards(); }
  }
  audio.addEventListener('play', onPlayState);
  audio.addEventListener('pause', onPlayState);
  audio.addEventListener('ended', () => {
    if (current){ setProg(current.path, { done: true, t: audio.duration || 0 }); saveProgress(); updateRecentBtn(); }
    onPlayState();
    if (current && current.fromList) playNextInList();
  });
  function playNextInList(){
    const next = savedList().find(s => !current || s.path !== current.path);
    if (!next){ showToast('סיימת את הרשימה'); return; }
    showToast('ממשיך לשיעור הבא ברשימה');
    playShiur(next.path);
  }
  audio.addEventListener('error', () => { if (current) showToast('לא הצלחנו לטעון את השיעור — נסו שוב'); });

  seekEl.addEventListener('input', () => {
    seeking = true;
    if (audio.duration) document.getElementById('playerCur').textContent = fmtTime(seekEl.value / 1000 * audio.duration);
  });
  seekEl.addEventListener('change', () => {
    seeking = false;
    if (audio.duration && isFinite(audio.duration)) audio.currentTime = seekEl.value / 1000 * audio.duration;
  });
  function skip(sec){
    if (!audio.duration) return;
    audio.currentTime = Math.min(Math.max(0, audio.currentTime + sec), audio.duration - 0.5);
  }
  document.getElementById('playerBack').addEventListener('click', () => skip(-15));
  document.getElementById('playerFwd').addEventListener('click', () => skip(15));
  document.getElementById('playerPlay').addEventListener('click', () => { if (current) audio.paused ? audio.play() : audio.pause(); });
  document.getElementById('playerClose').addEventListener('click', () => {
    rememberPosition(); saveProgress();
    audio.pause(); current = null;
    audio.removeAttribute('src'); audio.load();
    playerEl.hidden = true;
    document.body.classList.remove('has-player');
    refreshCards();
  });
  document.getElementById('playerTitle').addEventListener('click', () => {
    if (!current) return;
    view = { type:'parasha', key: current.s.pageKey, year: current.s.year };
    render(); scrollTop();
  });

  // מסך הנעילה / אוזניות / שעון: שם השיעור וכפתורי שליטה
  function setMediaSession(){
    if (!('mediaSession' in navigator) || !current) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: current.title,
        artist: 'הרה"ג רבי יצחק ולדומירסקי שליט"א',
        album: 'שיעורי פרשת שבוע ומועדים',
        artwork: [{ src: new URL('bg-rabbi.jpg', location.href).href, sizes: '2000x1500', type: 'image/jpeg' }]
      });
      const ms = navigator.mediaSession;
      ms.setActionHandler('play', () => audio.play());
      ms.setActionHandler('pause', () => audio.pause());
      ms.setActionHandler('seekbackward', () => skip(-15));
      ms.setActionHandler('seekforward', () => skip(15));
      ms.setActionHandler('seekto', (e) => { if (e.seekTime != null) audio.currentTime = e.seekTime; });
      ms.setActionHandler('nexttrack', current.fromList ? () => playNextInList() : null);
    } catch (e) {}
  }

  // יציאה מהדף / מעבר לאפליקציה אחרת - שומרים מיד, לא מחכים לטיימר
  window.addEventListener('pagehide', () => { rememberPosition(); saveProgress(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden){ rememberPosition(); saveProgress(); } });

  // כפתור "לדף הבית" - מחזיר לארון החומשים מכל עומק ניווט בקליק אחד
  function bindHomeBtn(){
    const btn = document.getElementById('homeBtn');
    if (!btn) return;
    btn.addEventListener('click', () => { view = { type:'shelf' }; render(); scrollTop(); });
  }

  // ====== תצוגות ======
  // ====== כתובת הדף משקפת את התצוגה ======
  // כל מעבר בין דפים נרשם בהיסטוריית הדפדפן, כדי שכפתור "חזור" של הטלפון
  // יחזור דף אחד אחורה (פרשה -> חומש -> דף הבית) ולא יצא מהאתר לגמרי.
  // אותו פורמט כמו directLink, כך שגם כתובת שהועתקה משורת הכתובת עובדת.
  function viewFromUrl(){
    const params = new URLSearchParams(location.search);
    if (params.has('new')) return { type:'recent' };
    if (params.has('list')) return { type:'list' };
    const key = params.get('parasha');
    if (key && chumashOf(key)) return { type:'parasha', key, year: params.get('year') || null };
    const name = params.get('chumash');
    if (name && CHUMASHIM.some(c => c.name === name)) return { type:'chumash', name };
    return { type:'shelf' };
  }

  function urlOf(v){
    const params = new URLSearchParams();
    if (v.type === 'recent') params.set('new', '1');
    if (v.type === 'list') params.set('list', '1');
    if (v.type === 'chumash') params.set('chumash', v.name);
    if (v.type === 'parasha'){
      params.set('parasha', v.key);
      if (v.year) params.set('year', v.year);
    }
    const q = params.toString();
    return location.pathname + (q ? '?' + q : '');
  }

  function sameView(a, b){
    return a.type === b.type && (a.name || null) === (b.name || null)
      && (a.key || null) === (b.key || null) && (a.year || null) === (b.year || null);
  }

  window.addEventListener('popstate', () => {
    if (view.type === 'error') return;
    view = viewFromUrl();
    render();
    window.scrollTo(0, 0);
  });

  function render(){
    if (view.type !== 'error' && !sameView(view, viewFromUrl())){
      history.pushState(null, '', urlOf(view));
    }
    if (view.type === 'error') renderError();
    else if (view.type === 'chumash') renderChumash(view.name);
    else if (view.type === 'parasha') renderParasha(view.key);
    else if (view.type === 'recent') renderRecent();
    else if (view.type === 'list') renderList();
    else renderShelf();

    // אנימציית כניסה: הדף נכנס בעדינות, והכרטיסים בתוכו במפל קל
    app.classList.remove('fade-in');
    void app.offsetWidth;
    app.classList.add('fade-in');
    app.querySelectorAll('.shelf .volume, .parasha-list .parasha-row').forEach((el, i) => {
      el.style.animationDelay = Math.min(i * 25, 400) + 'ms';
    });
    app.querySelectorAll('.shiur-row').forEach((el, i) => {
      el.style.animationDelay = Math.min(i * 40, 400) + 'ms';
    });
  }

  function renderShelf(){
    headerMeta.innerHTML = setupMode ? 'בהקמה' : `<strong>${totalCount()}</strong> שיעורים מוקלטים בארכיון`;
    let html = '<div class="shelf">';
    for (const c of CHUMASHIM){
      let count = 0;
      for (const key of pageKeysOf(c)) count += (index[key] || []).length;
      const empty = count === 0;
      const volumeLabel = c.name === 'מועדים' ? c.name : ('חומש ' + c.name);
      html += `<button class="volume${empty ? ' empty' : ''}" data-chumash="${c.name}">
        ${volumeLabel}<span class="count">${empty ? 'אין עדיין שיעורים' : count + ' שיעורים'}</span></button>`;
    }
    html += '</div>';
    if (setupMode) html = `<div class="note" style="margin-bottom:22px">האתר עדיין בהקמה — השיעורים יעלו בקרוב בעז"ה.</div>` + html;
    app.innerHTML = html;
    app.querySelectorAll('.volume').forEach(btn => {
      btn.addEventListener('click', () => { view = { type:'chumash', name:btn.dataset.chumash }; render(); scrollTop(); });
    });
  }

  // ====== חדש השבוע ======
  // לפי uploads.json, שסקריפט ההעלאה מעדכן בכל העלאה רגילה (עם מייל).
  // העלאת השלמות ("העלה בלי מייל") לא נרשמת שם, ולכן לא מופיעה כאן.
  // מוצג מה שעלה ב-7 הימים האחרונים; אם לא עלה כלום - ההעלאה האחרונה.
  function parseDay(d){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }

  function recentGroups(){
    const groups = {};   // תאריך -> [שיעור,...]
    for (const path in uploadDates){
      const s = byPath[path], day = parseDay(uploadDates[path]);
      if (s && day) (groups[uploadDates[path]] = groups[uploadDates[path]] || []).push(s);
    }
    const dates = Object.keys(groups).sort().reverse();
    if (!dates.length) return { dates: [], groups, thisWeek: false };
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const weekAgo = new Date(today.getTime() - 6 * 24 * 3600 * 1000);
    const week = dates.filter(d => parseDay(d) >= weekAgo);
    return week.length ? { dates: week, groups, thisWeek: true } : { dates: [dates[0]], groups, thisWeek: false };
  }

  // שני הכפתורים העליונים: "חדש השבוע" ו"הרשימה שלי" (כל אחד רק כשיש בו תוכן)
  function updateRecentBtn(){
    const row = document.getElementById('recentRow');
    const listBtn = document.getElementById('listBtn');
    const saved = savedList().length;
    const hasList = saved || continueList().length || heardList().length;
    listBtn.hidden = !hasList;
    listBtn.innerHTML = `הרשימה שלי${saved ? ` <span class="recent-badge">${saved}</span>` : ''}`;
    const r = recentGroups();
    document.getElementById('recentBtn').hidden = !r.dates.length;
    row.hidden = !r.dates.length && !hasList;
    if (!r.dates.length) return;
    // המונה סופר רק שיעורים שעוד לא נשמעו במכשיר הזה
    const count = r.dates.reduce((n, d) => n + r.groups[d].filter(s => !(getProg(s.path) || {}).done).length, 0);
    document.getElementById('recentBtn').innerHTML = r.thisWeek
      ? `חדש השבוע${count ? ` <span class="recent-badge">${count}</span>` : ''}`
      : 'העלאות אחרונות';
  }
  document.getElementById('recentBtn').addEventListener('click', () => { view = { type:'recent' }; render(); scrollTop(); });
  document.getElementById('listBtn').addEventListener('click', () => { view = { type:'list' }; render(); scrollTop(); });

  function renderList(){
    headerMeta.innerHTML = `<strong>${totalCount()}</strong> שיעורים מוקלטים בארכיון`;
    const saved = savedList(), cont = continueList(), heard = heardList();
    let html = `<div class="breadcrumb"><button class="home-link" id="homeBtn">${ICON_HOME} לדף הבית</button></div>
      <h2 class="page-title">הרשימה שלי</h2>
      <p class="page-sub">נשמר במכשיר הזה בלבד</p>`;
    if (!saved.length && !cont.length && !heard.length){
      html += `<div class="no-content">הרשימה ריקה.<br>לחצו על סימן השמירה ${ICON_BM} ליד שיעור כדי להוסיף אותו לכאן.</div>`;
    }
    if (cont.length){
      html += `<div class="recent-date">המשך האזנה</div>`;
      for (const s of cont) html += shiurRowHtml(s, s.pageKey, false, false, true);
    }
    if (saved.length){
      html += `<div class="list-head"><span class="recent-date">שמורים להמשך</span>
        <button class="recent-btn" id="playListBtn">${ICON_PLAY} נגן את הרשימה</button></div>`;
      for (const s of saved) html += shiurRowHtml(s, s.pageKey, false, false, true);
    }
    if (heard.length){
      html += `<div class="recent-date">נשמעו לאחרונה</div>`;
      for (const s of heard) html += shiurRowHtml(s, s.pageKey, false, false, true);
    }
    app.innerHTML = html;
    bindHomeBtn();
    const pl = document.getElementById('playListBtn');
    if (pl) pl.addEventListener('click', () => playShiur(savedList()[0].path));
  }

  function renderRecent(){
    headerMeta.innerHTML = `<strong>${totalCount()}</strong> שיעורים מוקלטים בארכיון`;
    const r = recentGroups();
    let html = `<div class="breadcrumb"><button class="home-link" id="homeBtn">${ICON_HOME} לדף הבית</button></div>
      <h2 class="page-title">${r.thisWeek ? 'חדש השבוע' : 'העלאות אחרונות'}</h2>
      <p class="page-sub">${r.thisWeek ? 'שיעורים שעלו לאתר בשבוע האחרון' : 'השבוע לא עלו שיעורים חדשים - זו ההעלאה האחרונה'}</p>`;
    if (!r.dates.length) html += `<div class="no-content">אין עדיין מידע על העלאות</div>`;
    for (const d of r.dates){
      html += `<div class="recent-date">${parseDay(d).toLocaleDateString('he-IL', { weekday:'long', day:'numeric', month:'long' })}</div>`;
      // שיעורים שכבר נשמעו - בסוף, עם הסימון שלהם
      const isDone = s => (getProg(s.path) || {}).done ? 1 : 0;
      const list = r.groups[d].slice().sort((a, b) => isDone(a) - isDone(b) || a.path.localeCompare(b.path));
      for (const s of list) html += shiurRowHtml(s, s.pageKey, false, false, true);
    }
    app.innerHTML = html;
    bindHomeBtn();
  }

  function renderChumash(name){
    headerMeta.innerHTML = setupMode ? 'בהקמה' : `<strong>${totalCount()}</strong> שיעורים מוקלטים בארכיון`;
    const c = CHUMASHIM.find(x => x.name === name);
    const isMoadim = name === 'מועדים';
    let html = `<div class="breadcrumb">${BREADCRUMB_HOME}<button id="backBtn">→ חזרה לתפריט הראשי</button></div>
      <h2 class="page-title">${isMoadim ? name : ('חומש ' + name)}</h2>
      <p class="page-sub">${isMoadim ? 'בחרו מועד' : 'בחרו פרשה'}</p><div class="parasha-list">`;
    for (const key of pageKeysOf(c)){
      const count = (index[key] || []).length;
      const label = pairLabel[key] || key;
      const empty = count === 0;
      html += `<button class="parasha-row${empty ? ' empty' : ''}" data-key="${key}">
        <span>${itemLabel(key, label)}</span><span class="count">${empty ? '—' : count + ' שיעורים'}</span></button>`;
    }
    html += '</div>';
    app.innerHTML = html;
    bindHomeBtn();
    document.getElementById('backBtn').addEventListener('click', () => { view = { type:'shelf' }; render(); });
    app.querySelectorAll('.parasha-row').forEach(btn => {
      btn.addEventListener('click', () => { view = { type:'parasha', key:btn.dataset.key }; render(); scrollTop(); });
    });
  }

  // שיעורי דף מסוים, מהחדש לישן (ובאותה שנה: לפי שיעור ואז לפי חלק)
  function sortedShiurim(key){
    return (index[key] || []).slice()
      .sort((a,b) => yearValue(b.year) - yearValue(a.year)
        || (a.lesson||'').localeCompare(b.lesson||'')
        || (a.part||'').localeCompare(b.part||''));
  }

  // withName: להציג גם את שם הפרשה/המועד (בדף "חדש השבוע" ובנגן, שמערבבים דפים)
  function shiurTitle(s, key, withName){
    const namePart = withName ? itemLabel(s.name, pairLabel[s.name] || s.name) + ' · ' : (s.name === key ? '' : s.name + ' · ');
    return `${namePart}${yearDisplay(s.year)}${s.lesson ? ' · שיעור ' + s.lesson : ''}${s.part ? ' · חלק ' + s.part : ''}${s.shabbatName ? ' · ' + s.shabbatName : ''}${s.isIyun ? ' · עיון' : ''}`;
  }

  // כרטיס שיעור אחד (כותרת, סיכום, שיתוף, סימון נשמע, ניגון, התקדמות) -
  // משותף לדף הפרשה ולדף "חדש השבוע". הניגון עצמו בנגן הקבוע בתחתית.
  function shiurRowHtml(s, key, hl, isTarget, withName){
    const title = shiurTitle(s, key, withName);
    const st = cardState(s.path);
    const audioUrl = shiurUrl(s);
    const shareUrl = directLink(key, s.year);
    const pdfPath = s.path.replace(/\.(m4a|mp3)$/i, '.pdf');
    const hasSummary = pdfPaths.has(pdfPath);
    const pdfVer = pdfVersions[pdfPath];
    const pdfUrl = R2_BASE.replace(/\/$/,'') + '/' + pdfPath.split('/').map(encodeURIComponent).join('/') + (pdfVer ? '?v=' + encodeURIComponent(pdfVer) : '');
    return `<div class="shiur-row${hl ? ' hl' : ''}${st.done ? ' is-done' : ''}${st.isCur ? ' playing' : ''}" data-path="${escAttr(s.path)}"${isTarget ? ' id="target-year"' : ''}>
        <div class="shiur-head">
          <span class="shiur-title">${title}</span>
          <button class="play-btn" aria-label="${st.playing ? 'השהה' : 'נגן'}">${st.playing ? ICON_PAUSE : ICON_PLAY}</button>
        </div>
        <div class="shiur-sub">
          <span class="shiur-meta">${st.meta}</span>
          <span class="shiur-actions">
            ${hasSummary ? `<a class="text-link" href="${pdfUrl}" target="_blank" rel="noopener" title="הורד סיכום השיעור">${ICON_DOWNLOAD} סיכום</a>` : ''}
            <a class="share-btn" href="${audioUrl}" download="${escAttr(s.filename)}" target="_blank" rel="noopener" title="הורד את השיעור" aria-label="הורד את השיעור">${ICON_AUDIO_DL}</a>
            <button class="share-btn" data-link="${escAttr(shareUrl)}" title="העתק קישור לשיעור זה" aria-label="העתק קישור לשיעור זה">${ICON_LINK}</button>
            <button class="save-btn${st.saved ? ' on' : ''}" title="${st.saved ? 'הסר מהרשימה שלי' : 'שמור לרשימה שלי'}" aria-label="שמירה לרשימה שלי">${st.saved ? ICON_BM_ON : ICON_BM}</button>
            <button class="heard-btn${st.done ? ' on' : ''}" title="${st.done ? 'בטל סימון &quot;נשמע&quot;' : 'סמן כנשמע'}" aria-label="סימון נשמע"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m7.5 12.5 3 3 6-6.5"/></svg></button>
          </span>
        </div>
        <div class="shiur-bar"><i style="width:${st.pct}%"></i></div>
      </div>`;
  }

  function renderParasha(key){
    headerMeta.innerHTML = setupMode ? 'בהקמה' : `<strong>${totalCount()}</strong> שיעורים מוקלטים בארכיון`;
    const chumash = chumashOf(key);
    const label = pairLabel[key] || key;
    const shiurim = sortedShiurim(key);
    const backLabel = chumash === 'מועדים' ? 'חזרה למועדים' : ('חזרה לחומש ' + chumash);
    let html = `<div class="breadcrumb">${BREADCRUMB_HOME}<button id="backBtn">→ ${backLabel}</button></div>
      <h2 class="page-title">${itemLabel(key, label)}</h2>
      <p class="page-sub">כל השיעורים, מהחדש לישן</p>`;
    if (!shiurim.length){
      html += `<div class="no-content">אין עדיין שיעורים ל${itemNounOf(key)}</div>`;
    }
    let marked = false;
    for (const s of shiurim){
      const hl = view.year && s.year === view.year;
      html += shiurRowHtml(s, key, hl, hl && !marked);
      if (hl) marked = true;
    }
    app.innerHTML = html;
    bindHomeBtn();
    document.getElementById('backBtn').addEventListener('click', () => { view = { type:'chumash', name:chumash }; render(); });
    const target = document.getElementById('target-year');
    if (target){
      setTimeout(() => target.scrollIntoView({ behavior:'smooth', block:'center' }), 100);
    }
  }


  function renderError(msg){
    headerMeta.textContent = '';
    app.innerHTML = `<div class="note">שגיאה בטעינת רשימת השיעורים.<br>נסו לרענן את הדף.</div>`;
  }

  function scrollTop(){ window.scrollTo({ top:0, behavior:'smooth' }); }

  // ====== חיפוש עם תפריט הצעות ======
  const searchInput = document.getElementById('searchInput');
  const suggestBox = document.getElementById('suggest');

  // האם q מתאים לתחילת מילה כלשהי בשם ("כי" -> "כי תשא", "מות" -> "אחרי מות")
  function wordPrefixMatch(name, q){
    if (!q) return false;
    const positions = [0];
    for (let i = 0; i < name.length; i++) if (name[i] === ' ') positions.push(i + 1);
    return positions.some(p => name.slice(p).startsWith(q));
  }

  // שמות החיפוש של כל דף: הדף עצמו + חברי הזוג ("פקודי" מוצא את ויקהל-פקודי)
  function searchNamesOf(key){
    const names = [key];
    for (const p of PAIRS){ if (p[0] + ' ' + p[1] === key){ names.push(p[0], p[1]); } }
    return names;
  }

  function isYearToken(t){
    return /^ת[שת]/.test(t) && t.length >= 2 && t.length <= 5 && yearValue(t) > 0;
  }

  // פירוש הקלט: קודם מנסים הכל כשם פרשה; אם אין התאמות והטוקן האחרון נראה כשנה - שם + שנה
  function interpretQuery(raw){
    let tokens = raw.trim().split(/\s+/).filter(Boolean);
    if (tokens[0] === 'פרשת' || tokens[0] === 'מועד') tokens = tokens.slice(1);
    if (!tokens.length) return null;
    const asName = tokens.join(' ');
    const keysWithContent = Object.keys(index).filter(k => index[k].length);
    const matchA = keysWithContent.filter(k => searchNamesOf(k).some(n => wordPrefixMatch(n, asName)));
    if (matchA.length) return { keys: matchA, year: null };
    if (tokens.length >= 2 && isYearToken(tokens[tokens.length - 1])){
      const yearQ = tokens[tokens.length - 1];
      const nameQ = tokens.slice(0, -1).join(' ');
      const matchB = keysWithContent.filter(k => searchNamesOf(k).some(n => wordPrefixMatch(n, nameQ)));
      if (matchB.length) return { keys: matchB, year: yearQ };
    }
    return { keys: [], year: null };
  }

  function buildSuggestions(){
    const raw = searchInput.value;
    if (!raw.trim()){ suggestBox.hidden = true; suggestBox.innerHTML = ''; return; }
    const res = interpretQuery(raw);
    let html = '';
    let shown = 0;
    if (res && res.keys.length){
      for (const key of res.keys){
        const label = pairLabel[key] || key;
        if (res.year){
          // הצעה לכל שנה תואמת בדף הזה
          const years = [...new Set(index[key].map(s => s.year))]
            .filter(y => y.startsWith(res.year))
            .sort((a,b) => yearValue(b) - yearValue(a));
          for (const y of years){
            if (shown >= 8) break;
            shown++;
            html += `<button data-key="${key}" data-year="${y}"><span>${itemLabel(key, label)}</span><span class="yr">${yearDisplay(y)}</span></button>`;
          }
        } else {
          if (shown >= 8) break;
          shown++;
          const n = index[key].length;
          html += `<button data-key="${key}"><span>${itemLabel(key, label)}</span><span class="yr">${n} שיעורים</span></button>`;
        }
      }
    }
    if (!shown) html = `<div class="none">לא נמצאה התאמה</div>`;
    suggestBox.innerHTML = html;
    suggestBox.hidden = false;
    // mousedown ולא click - כדי להקדים את סגירת התפריט ב-blur
    suggestBox.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        openSuggestion(btn.dataset.key, btn.dataset.year || null);
      });
    });
  }

  function openSuggestion(key, year){
    suggestBox.hidden = true;
    view = { type:'parasha', key, year };
    render();
    scrollTop();
  }

  searchInput.addEventListener('input', buildSuggestions);
  searchInput.addEventListener('focus', buildSuggestions);
  searchInput.addEventListener('blur', () => { setTimeout(() => { suggestBox.hidden = true; }, 150); });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){
      e.preventDefault();
      const first = suggestBox.querySelector('button');
      if (first) openSuggestion(first.dataset.key, first.dataset.year || null);
    }
    if (e.key === 'Escape'){ suggestBox.hidden = true; }
  });

  // ====== טעינה ======
  function load(){
    if (R2_BASE.indexOf('PASTE_') === 0){
      document.querySelector('.search-row').hidden = true;  // אין מה לחפש עדיין
      setupMode = true;
      view = { type:'shelf' }; render();
      return Promise.resolve(true);
    }
    const versionsReq = fetch('pdf-versions.json?t=' + Date.now())
      .then(r => r.ok ? r.json() : {})
      .catch(() => ({}));
    const uploadsReq = fetch('uploads.json?t=' + Date.now())
      .then(r => r.ok ? r.json() : {})
      .catch(() => ({}));
    return Promise.all([fetch('list.json?t=' + Date.now())
      .then(r => {
        if (r.status === 404) return [];   // הרשימה טרם נוצרה - מצב הקמה
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      }), versionsReq, uploadsReq])
      .then(([files, versions, uploads]) => {
        pdfVersions = versions || {};
        uploadDates = uploads || {};
        byPath = {};
        if (!files.length) setupMode = true;
        index = {}; unmatched = []; pdfPaths = new Set();
        for (const path of files){
          // קבצי סיכום PDF לא עוברים דרך parseFilename - הם נשמרים בצד
          // כדי לבדוק בהמשך אם יש סיכום זמין לכל שיעור (אותו נתיב, סיומת שונה)
          if (/\.pdf$/i.test(path)){ pdfPaths.add(path); continue; }
          const s = parseFilename(path);
          if (s){ (index[s.pageKey] = index[s.pageKey] || []).push(s); byPath[path] = s; }
          else unmatched.push(path);
        }
        // בטעינה הראשונה (או אחרי שגיאה) התצוגה נקבעת לפי הכתובת - כך עובדים
        // קישור ישיר לפרשה (?parasha=...&year=...) ורענון הדף בכל עומק ניווט
        updateRecentBtn();
        view = viewFromUrl();
        render();
        return true;
      })
      .catch(() => { view = { type:'error' }; render(); return false; });
  }

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  load();
})();
</script>
</body>
